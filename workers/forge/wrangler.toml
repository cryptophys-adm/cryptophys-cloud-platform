name = "cryptophys-forge"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
# ACCESS_TEAM_DOMAIN, ACCESS_AUD, OPERATOR_IDENTITIES and APPROVER_IDENTITIES are set at deploy time.
SERVICE_NAME = "cryptophys-forge"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"

# Audit chain (forge.imported, forge.mirror_token_issued). The account-specific database_id is
# substituted at deploy time (ADR-0001).
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

# ADR-0012 phase 1: the platform source on Cloudflare Artifacts (namespace cryptophys, repo platform).
[[artifacts]]
binding = "ARTIFACTS"
namespace = "cryptophys"

# ADR-0012 phase 3: Forge checks. Each tick checks at most one new commit of main (checks.ts), off
# the minutes the other control-plane crons use (:02/:07/:10/:13/:15/...).
[triggers]
crons = ["4,19,34,49 * * * *"]

# Owner 2026-11-12 ("DNA untuk XAUUSD dan Omega dengan auto-register"): the XAUUSD organs' DNA for the
# organism census. The xauusd AI Worker's OrganismDna has one read-only method, dna(); what it declares is held
# to the external ceiling (control-plane-shared/src/organism.ts) and registered only by consensus.
[[services]]
binding = "EXT_ORGANISM_XAUUSD"
service = "xauusd-ai-trading-assistant"
entrypoint = "OrganismDna"

# The test suite runs in Dynamic Workers, with no network access.
[[worker_loaders]]
binding = "LOADER"

# Bundling the suite with esbuild-wasm takes seconds of CPU; a cron tick may use up to 5 minutes.
[limits]
cpu_ms = 300000

# The runner shims and the sql.js glue are shipped as text and loaded into the test Workers.
# Wrangler matches these globs against the import specifier as written in runner/assets.js.
[[rules]]
type = "Text"
globs = ["**/shims/node-*.js", "**/sql.js/dist/sql-wasm.js"]
fallthrough = true

# ADR-0012 §5c: the type-check does not fit in an isolate. A Container for it was deployed and
# withdrawn on 2026-11-08 (owner decision: Workers Builds instead, see workers/forge-typecheck).
# The v1 migration created its Durable Object class; v2 deletes it. Both stay for the migration history.
[[migrations]]
tag = "v1-typecheck-container"
new_sqlite_classes = ["TypecheckContainer"]

[[migrations]]
tag = "v2-drop-typecheck-container"
deleted_classes = ["TypecheckContainer"]
