name = "cryptophys-recovery-manager"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Hourly check for the Cloudflare-native daily D1 backup (src/backup.ts, primary since 2026-11-07):
# writes a dump only when no backup is newer than 24 h. Minute :13 has no other platform cron.
[triggers]
crons = ["13 * * * *"]

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# Dedicated Workers AI engine for this Worker (architecture/AI-ENGINE-REQUIREMENT.md).
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-recovery-manager"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Per-service and coordinated account-wide daily request caps (Workers AI Free allocation).
AI_DAILY_REQUEST_LIMIT = "80"
# 75 (owner 2026-11-11, "high usage excess free tier"): the free 10k neurons/day are shared with every
# Worker on the account (XAUUSD, Aether). At the worst case (~34 neurons a request) the platform can use
# at most ~2.6k of them; it used about 15 requests a day in the week before.
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "75"
# Recovery plan windows enforced by the handlers and closed by RecoveryPlanWorkflow (ADR-0006).
RECOVERY_APPROVAL_WINDOW_HOURS = "72"
RECOVERY_EXECUTION_WINDOW_HOURS = "24"
RECOVERY_FINISH_WINDOW_HOURS = "24"

# The account-specific database_id is kept out of Git (ADR-0001). The deploy workflow
# resolves it from the Cloudflare API by exact database name and substitutes it.
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

# Private bucket for D1 backups, shared with the nightly d1-backup.yml (same key format).
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "cryptophys-d1-backups"

# Execution must obtain an allow decision from the Policy Engine.
[[services]]
binding = "POLICY"
service = "cryptophys-policy-engine"
entrypoint = "PolicyRpc"

# Autonomous recovery: the approved plan's redeploy step dispatches through the Deployment Orchestrator.
[[services]]
binding = "DEPLOY"
service = "cryptophys-deployment-orchestrator"
entrypoint = "DeployRpc"

# No shared secrets: /v1 is authorized by the verified Cloudflare Access identity. The
# deploy workflow sets OPERATOR_IDENTITIES and APPROVER_IDENTITIES from the Environment.

# One Workflow instance per recovery plan (ADR-0006): it waits on the approval and execution
# windows and closes a stale plan with an audit event. A plan uses a handful of steps.
[[workflows]]
name = "cryptophys-recovery-lifecycle"
binding = "RECOVERY_LIFECYCLE"
class_name = "RecoveryPlanWorkflow"

[workflows.default_retention]
success_retention = "30 days"
error_retention = "30 days"

# AI Kernel AgentRpc (ADR-0007 §1.1, TP-011): this Worker may act only as the agents whose
# host_worker is cryptophys-recovery-manager, at tier <= 1, through the policy-gated syscall path. The props value
# is set here by the account owner's reviewed config; the kernel trusts it as the caller identity.
[[services]]
binding = "AGENTS"
service = "cryptophys-ai-kernel"
entrypoint = "AgentRpc"
props = { host_worker = "cryptophys-recovery-manager" }
