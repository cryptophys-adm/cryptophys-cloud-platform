name = "cryptophys-signal-engine"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# Closed candles are final a few minutes after the hour; four runs an hour keep 1h/4h
# series current at ~2.9k invocations and ~29k public market-data subrequests a month.
[triggers]
crons = ["4,19,34,49 * * * *"]

# Dedicated Workers AI engine for this Worker (architecture/AI-ENGINE-REQUIREMENT.md).
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-signal-engine"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_DAILY_REQUEST_LIMIT = "40"
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "400"
# Public market data only (ADR-0005): no exchange account, no API keys, no orders. Binance
# refuses Cloudflare Worker egress (HTTP 403 in every production run), so Kraken is used.
MARKET_DATA_PROVIDER = "kraken"
SYMBOLS = "BTCUSDT,ETHUSDT,SOLUSDT"
TIMEFRAMES = "1h,4h"

# The account-specific database_id is kept out of Git (ADR-0001). The deploy workflow
# resolves it from the Cloudflare API by exact database name and substitutes it.
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

# No shared secrets: /v1 is authorized by the verified Cloudflare Access identity. The
# deploy workflow sets OPERATOR_IDENTITIES from the GitHub production Environment.

# The cron creates one Workflow instance per firing (ADR-0006); each series is a durable step
# with retries. About 12 steps a run, ~35k a month, inside the Workers Paid included 500k.
[[workflows]]
name = "cryptophys-signal-ingest"
binding = "INGEST_WORKFLOW"
class_name = "SignalIngestWorkflow"

[workflows.default_retention]
success_retention = "3 days"
error_retention = "14 days"

# AI Kernel AgentRpc (ADR-0007 §1.1, TP-011): this Worker may act only as the agents whose
# host_worker is cryptophys-signal-engine, at tier <= 1, through the policy-gated syscall path. The props value
# is set here by the account owner's reviewed config; the kernel trusts it as the caller identity.
[[services]]
binding = "AGENTS"
service = "cryptophys-ai-kernel"
entrypoint = "AgentRpc"
props = { host_worker = "cryptophys-signal-engine" }
