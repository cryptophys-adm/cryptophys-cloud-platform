name = "cryptophys-console"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
# ADR-0010 (single subdomain): the Console is part of Nexus at nexus.cryptophys.work/console/. A
# Workers route on the Nexus hostname takes precedence over the Nexus Worker's Custom Domain for
# /console*. console.cryptophys.work stays attached only to redirect there, until it is removed.
routes = [
  { pattern = "nexus.cryptophys.work/console*", zone_name = "cryptophys.work" },
  { pattern = "console.cryptophys.work", custom_domain = true },
]

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
SERVICE_NAME = "cryptophys-console"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
NEXUS_ORIGIN = "https://nexus.cryptophys.work"
LEGACY_HOSTS = "console.cryptophys.work"

# No AI, D1, Durable Objects or secrets. ACCESS_TEAM_DOMAIN, ACCESS_AUD, OPERATOR_IDENTITIES and
# APPROVER_IDENTITIES are set at deploy time. The Console has no authority of its own (ADR-0008 §3):
# it forwards the operator's own Access JWT to the default fetch handler of each Worker below.

[[services]]
binding = "KERNEL"
service = "cryptophys-ai-kernel"

[[services]]
binding = "RECOVERY"
service = "cryptophys-recovery-manager"

[[services]]
binding = "REGISTRY"
service = "cryptophys-platform-registry"

[[services]]
binding = "POLICY"
service = "cryptophys-policy-engine"

[[services]]
binding = "DRIFT"
service = "cryptophys-drift-detector"

[[services]]
binding = "AUDIT"
service = "cryptophys-audit-ledger"

[[services]]
binding = "ORCHESTRATOR"
service = "cryptophys-deployment-orchestrator"

[[services]]
binding = "PLATFORM"
service = "cryptophys-platform-api"

# Console UI (React SPA in the Nexus obsidian design), built from ui/ into ui/dist by the deploy
# and validation workflows. run_worker_first: every request, assets included, passes the Access,
# operator, CSP and allow-list checks in src/index.ts before anything is served.
[assets]
directory = "./ui/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
