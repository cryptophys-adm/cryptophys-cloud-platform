name = "cryptophys-deployment-orchestrator"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "deploy-orchestrator.cryptophys.work", custom_domain = true }]

[observability]
enabled = true

# Wave A: reconcile the deployment ledger (running -> succeeded/failed) at :10 and :40.
# ADR-0012 phase 2: run queued native rollbacks at every minute outside the drift and kernel
# cron windows (a subset of SAFE in .github/scripts/wait-cron-window.sh).
[triggers]
crons = ["2,10,17,25,32,40,47,55 * * * *"]

[version_metadata]
binding = "CF_VERSION_METADATA"

# Dedicated Deployment Orchestrator AI engine (advisory only; AI-ENGINE-REQUIREMENT.md).
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-deployment-orchestrator"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_DAILY_REQUEST_LIMIT = "80"
# 75 (owner 2026-11-11, "high usage excess free tier"): the free 10k neurons/day are shared with every
# Worker on the account (XAUUSD, Aether). At the worst case (~34 neurons a request) the platform can use
# at most ~2.6k of them; it used about 15 requests a day in the week before.
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "75"

# Shared control-plane database: deployment ledger, audit log, AI budget. The
# account-specific database_id is substituted at deploy time (ADR-0001).
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

[[durable_objects.bindings]]
name = "DEPLOYMENT_LOCK"
class_name = "DeploymentLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeploymentLock"]

# Secrets are configured out-of-band in Cloudflare and are never stored in this file.

# AI Kernel AgentRpc (ADR-0007 §1.1, TP-011): this Worker may act only as the agents whose
# host_worker is cryptophys-deployment-orchestrator, at tier <= 1, through the policy-gated syscall path. The props value
# is set here by the account owner's reviewed config; the kernel trusts it as the caller identity.
[[services]]
binding = "AGENTS"
service = "cryptophys-ai-kernel"
entrypoint = "AgentRpc"
props = { host_worker = "cryptophys-deployment-orchestrator" }

# ADR-0012 phase 2: native rollback verifies through the Drift Detector (read-only probe) and
# records the desired version through the Registry (only for a running native rollback request).
[[services]]
binding = "DRIFT"
service = "cryptophys-drift-detector"
entrypoint = "DriftRpc"

[[services]]
binding = "REGISTRY"
service = "cryptophys-platform-registry"
entrypoint = "RegistryRpc"
