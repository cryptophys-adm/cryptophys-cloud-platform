name = "cryptophys-deployment-orchestrator"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "deploy-orchestrator.cryptophys.work", custom_domain = true }]

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# Dedicated Deployment Orchestrator AI engine (advisory only; AI-ENGINE-REQUIREMENT.md).
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-deployment-orchestrator"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_DAILY_REQUEST_LIMIT = "80"
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "400"

# Shared control-plane database: deployment ledger, audit log, AI budget. The
# account-specific database_id is substituted at deploy time (ADR-0001).
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

[[durable_objects.bindings]]
name = "DEPLOYMENT_LOCK"
class_name = "DeploymentLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeploymentLock"]

# Secrets are configured out-of-band in Cloudflare and are never stored in this file.
