name = "cryptophys-deployment-orchestrator-staging"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[vars]
SERVICE_NAME = "cryptophys-deployment-orchestrator"
SERVICE_ENVIRONMENT = "staging"
API_CONTRACT_VERSION = "v1"

[[durable_objects.bindings]]
name = "DEPLOYMENT_LOCK"
class_name = "DeploymentLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeploymentLock"]

# Configure secrets via wrangler secret put after review; no production routes during staging.
