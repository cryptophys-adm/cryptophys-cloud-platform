name = "cryptophys-deployment-orchestrator"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[vars]
SERVICE_NAME = "cryptophys-deployment-orchestrator"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"

[[durable_objects.bindings]]
name = "DEPLOYMENT_LOCK"
class_name = "DeploymentLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeploymentLock"]

# Secrets are configured out-of-band in Cloudflare. The public workers.dev endpoint exposes health/readiness only; deployment requests require the shared bearer secret.
