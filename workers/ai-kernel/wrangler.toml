name = "cryptophys-ai-kernel"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# The supervisor agent wakes after the Drift Detector (every 15 min) has written, so it reasons on fresh state.
[triggers]
crons = ["7,22,37,52 * * * *"]

# Dedicated Workers AI engine (architecture/AI-ENGINE-REQUIREMENT.md, ADR-0007). It only runs
# when the supervisor drafts a proposal, never on a quiet cycle.
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-ai-kernel"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# 80 (was 40; owner 2026-11-07): the hourly Auditor digest alone needs 24, and on 2026-11-06 the
# 40 cap was reached by 12:37, leaving the rest of the day's digests without AI text.
AI_DAILY_REQUEST_LIMIT = "80"
# 250 keeps the worst case (6k-char input, 600 output tokens, ~34 neurons) under the free 10k neurons/day (2026-11-07).
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "250"

[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

# Syscall targets (ADR-0007). Each target re-verifies the Policy Engine decision id.
[[services]]
binding = "POLICY"
service = "cryptophys-policy-engine"
entrypoint = "PolicyRpc"

[[services]]
binding = "RECOVERY"
service = "cryptophys-recovery-manager"
entrypoint = "RecoveryRpc"

# ADR-0009 phase 2 executors. Each target re-verifies the proposal and its policy decision.
[[services]]
binding = "REGISTRY"
service = "cryptophys-platform-registry"
entrypoint = "RegistryRpc"

[[services]]
binding = "DRIFT"
service = "cryptophys-drift-detector"
entrypoint = "DriftRpc"

# ADR-0009 phase 3: pending deploys and consensus deploy_commit dispatch.
[[services]]
binding = "DEPLOY"
service = "cryptophys-deployment-orchestrator"
entrypoint = "DeployRpc"

# Wave C (C1): each control-plane Worker casts its own consensus vote (VoteRpc).
[[services]]
binding = "VOTE_PLATFORM_API"
service = "cryptophys-platform-api"
entrypoint = "VoteRpc"

[[services]]
binding = "VOTE_DEPLOYMENT_ORCHESTRATOR"
service = "cryptophys-deployment-orchestrator"
entrypoint = "VoteRpc"

[[services]]
binding = "VOTE_PLATFORM_REGISTRY"
service = "cryptophys-platform-registry"
entrypoint = "VoteRpc"

[[services]]
binding = "VOTE_POLICY_ENGINE"
service = "cryptophys-policy-engine"
entrypoint = "VoteRpc"

[[services]]
binding = "VOTE_DRIFT_DETECTOR"
service = "cryptophys-drift-detector"
entrypoint = "VoteRpc"

[[services]]
binding = "VOTE_AUDIT_LEDGER"
service = "cryptophys-audit-ledger"
entrypoint = "VoteRpc"

[[services]]
binding = "VOTE_RECOVERY_MANAGER"
service = "cryptophys-recovery-manager"
entrypoint = "VoteRpc"

# Read-only access to the XAUUSD advisory decision chain (TP-017).
[[services]]
binding = "XAUUSD_AI"
service = "xauusd-ai-trading-assistant"

# Agent processes: SQLite-backed Durable Objects (Workers Paid included usage).
[[durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "SupervisorAgent"

[[durable_objects.bindings]]
name = "SIGNAL_ANALYST"
class_name = "SignalAnalystAgent"

[[durable_objects.bindings]]
name = "AUDITOR"
class_name = "AuditorAgent"

[[vectorize]]
binding = "MEMORY"
index_name = "cryptophys-agent-memory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupervisorAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SignalAnalystAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AuditorAgent"]

# No shared secrets: /v1 and /mcp are authorized by the verified Cloudflare Access identity.
# The deploy workflow sets OPERATOR_IDENTITIES and APPROVER_IDENTITIES from the Environment.
