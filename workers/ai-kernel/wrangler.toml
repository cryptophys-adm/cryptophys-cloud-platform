name = "cryptophys-ai-kernel"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# The supervisor agent wakes after the Drift Detector (every 15 min) has written, so it reasons on fresh state.
[triggers]
crons = ["7,22,37,52 * * * *"]

# Dedicated Workers AI engine (architecture/AI-ENGINE-REQUIREMENT.md, ADR-0007). It only runs
# when the supervisor drafts a proposal, never on a quiet cycle.
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-ai-kernel"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_DAILY_REQUEST_LIMIT = "40"
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "400"

[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

# Syscall targets (ADR-0007). Each target re-verifies the Policy Engine decision id.
[[services]]
binding = "POLICY"
service = "cryptophys-policy-engine"
entrypoint = "PolicyRpc"

[[services]]
binding = "RECOVERY"
service = "cryptophys-recovery-manager"
entrypoint = "RecoveryRpc"

# Read-only access to the XAUUSD advisory decision chain (TP-017).
[[services]]
binding = "XAUUSD_AI"
service = "xauusd-ai-trading-assistant"

# Agent processes: SQLite-backed Durable Objects (Workers Paid included usage).
[[durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "SupervisorAgent"

[[durable_objects.bindings]]
name = "SIGNAL_ANALYST"
class_name = "SignalAnalystAgent"

[[durable_objects.bindings]]
name = "AUDITOR"
class_name = "AuditorAgent"

[[vectorize]]
binding = "MEMORY"
index_name = "cryptophys-agent-memory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupervisorAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SignalAnalystAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AuditorAgent"]

# No shared secrets: /v1 and /mcp are authorized by the verified Cloudflare Access identity.
# The deploy workflow sets OPERATOR_IDENTITIES and APPROVER_IDENTITIES from the Environment.
