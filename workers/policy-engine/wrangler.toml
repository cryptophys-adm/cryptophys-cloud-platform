name = "cryptophys-policy-engine"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# Dedicated Workers AI engine for this Worker (architecture/AI-ENGINE-REQUIREMENT.md).
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-policy-engine"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Per-service and coordinated account-wide daily request caps (Workers AI Free allocation).
AI_DAILY_REQUEST_LIMIT = "80"
# 75 (owner 2026-11-11, "high usage excess free tier"): a request cap for the platform Workers together,
# counted in this repository's D1 (ai_usage). It is not a Cloudflare neuron meter and does not cover
# XAUUSD or Aether (TP-029). At the task bounds (~34 neurons a request, an estimate) it allows ~2.6k of
# the account's shared 10k free neurons a day. Measured 2026-11-04..10: 20.4 requests a day, peak 42.
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "75"

# The account-specific database_id is kept out of Git (ADR-0001). The deploy workflow
# resolves it from the Cloudflare API by exact database name and substitutes it.
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

# No shared secrets: /v1 is authorized by the verified Cloudflare Access identity. The
# deploy workflow sets OPERATOR_IDENTITIES from the GitHub production Environment.

# AI Kernel AgentRpc (ADR-0007 §1.1, TP-011): this Worker may act only as the agents whose
# host_worker is cryptophys-policy-engine, at tier <= 1, through the policy-gated syscall path. The props value
# is set here by the account owner's reviewed config; the kernel trusts it as the caller identity.
[[services]]
binding = "AGENTS"
service = "cryptophys-ai-kernel"
entrypoint = "AgentRpc"
props = { host_worker = "cryptophys-policy-engine" }
