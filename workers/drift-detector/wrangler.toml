name = "cryptophys-drift-detector"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# Dedicated Workers AI engine for this Worker (architecture/AI-ENGINE-REQUIREMENT.md).
[ai]
binding = "AI"

[vars]
SERVICE_NAME = "cryptophys-drift-detector"
SERVICE_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Per-service and coordinated account-wide daily request caps (Workers AI Free allocation).
AI_DAILY_REQUEST_LIMIT = "80"
# 250 keeps the worst case (6k-char input, 600 output tokens, ~34 neurons) under the free 10k neurons/day (2026-11-07).
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "250"

# The account-specific database_id is kept out of Git (ADR-0001). The deploy workflow
# resolves it from the Cloudflare API by exact database name and substitutes it.
[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"
migrations_dir = "../control-plane-migrations"

[triggers]
crons = ["*/15 * * * *"]

# Observation uses RPC service bindings (HealthRpc entrypoint), never HTTP routes.
[[services]]
binding = "SVC_PLATFORM_API"
service = "cryptophys-platform-api"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_DEPLOYMENT_ORCHESTRATOR"
service = "cryptophys-deployment-orchestrator"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_PLATFORM_REGISTRY"
service = "cryptophys-platform-registry"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_POLICY_ENGINE"
service = "cryptophys-policy-engine"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_AUDIT_LEDGER"
service = "cryptophys-audit-ledger"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_RECOVERY_MANAGER"
service = "cryptophys-recovery-manager"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_AI_KERNEL"
service = "cryptophys-ai-kernel"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_CONSOLE"
service = "cryptophys-console"
entrypoint = "HealthRpc"

[[services]]
binding = "SVC_HOME"
service = "cryptophys-home"
entrypoint = "HealthRpc"

# xauusd Workers are deployed from cryptophys-adm/xauusd-ai-trading-assistant (ADR-0005
# decision 7). Plain service bindings reach their fetch handler for a /health probe only;
# they never leave Cloudflare and need no route, token or change in that repository.
[[services]]
binding = "EXT_XAUUSD_AI"
service = "xauusd-ai-trading-assistant"

[[services]]
binding = "EXT_XAUUSD_NEWS"
service = "xauusd-fundamental-news-ingestion"

[[services]]
binding = "EXT_XAUUSD_PULL_ADAPTER"
service = "xauusd-tradingview-pull-adapter"

[[services]]
binding = "EXT_XAUUSD_NEXUS"
service = "xauusd-nexus-dashboard"

# Aether, the Knowledge Guardian cluster (TP-027): an external Worker deployed by Workers Builds
# from cryptophys-adm/cryptophys-aether, probed at /health like the xauusd Workers.
[[services]]
binding = "EXT_AETHER"
service = "cryptophys-aether"

# No shared secrets: /v1 is authorized by the verified Cloudflare Access identity. The
# deploy workflow sets OPERATOR_IDENTITIES from the GitHub production Environment.

# AI Kernel AgentRpc (ADR-0007 §1.1, TP-011): this Worker may act only as the agents whose
# host_worker is cryptophys-drift-detector, at tier <= 1, through the policy-gated syscall path. The props value
# is set here by the account owner's reviewed config; the kernel trusts it as the caller identity.
[[services]]
binding = "AGENTS"
service = "cryptophys-ai-kernel"
entrypoint = "AgentRpc"
props = { host_worker = "cryptophys-drift-detector" }
