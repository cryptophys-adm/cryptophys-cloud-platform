name = "cryptophys-platform-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# The account-wide Observer (owner 2026-11-14; control-plane-shared/src/observer.ts): senses at :27 (the last
# complete UTC hour, from the GraphQL Analytics API with the CF_ANALYTICS_TOKEN this Worker already holds) and the
# account inventory at :27 and :57. Both minutes are off every other platform cron (docs/SSOT.md).
[triggers]
crons = ["27,57 * * * *"]

[vars]
PLATFORM_NAME = "cryptophys-cloud-platform"
PLATFORM_ENVIRONMENT = "production"
API_CONTRACT_VERSION = "v1"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_DAILY_REQUEST_LIMIT = "40"
# 75 (owner 2026-11-11, "high usage excess free tier"): a request cap for the platform Workers together,
# counted in this repository's D1 (ai_usage). It is not a Cloudflare neuron meter and does not cover
# XAUUSD or Aether (TP-029). At the task bounds (~34 neurons a request, an estimate) it allows ~2.6k of
# the account's shared 10k free neurons a day. Measured 2026-11-04..10: 20.4 requests a day, peak 42.
AI_ACCOUNT_DAILY_REQUEST_LIMIT = "75"

# No routes, custom domains or secrets are configured. The D1 database_id is resolved by the
# deploy workflow (ADR-0001); OPERATOR_IDENTITIES and the Access vars are set at deploy time.

# AI Worker OS gateway (ADR-0007). Dedicated Workers AI engine for this Worker
# (architecture/AI-ENGINE-REQUIREMENT.md); its budget is enforced in the control-plane D1.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "cryptophys-control-plane"
database_id = "__CONTROL_PLANE_D1_DATABASE_ID__"

# Read-only kernel view for GET /v1/overview.
[[services]]
binding = "KERNEL"
service = "cryptophys-ai-kernel"
entrypoint = "KernelRpc"

# AI Kernel AgentRpc (ADR-0007 §1.1, TP-011): this Worker may act only as the agents whose
# host_worker is cryptophys-platform-api, at tier <= 1, through the policy-gated syscall path. The props value
# is set here by the account owner's reviewed config; the kernel trusts it as the caller identity.
[[services]]
binding = "AGENTS"
service = "cryptophys-ai-kernel"
entrypoint = "AgentRpc"
props = { host_worker = "cryptophys-platform-api" }
