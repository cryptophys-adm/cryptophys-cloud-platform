name: Report CI to Forge

# ADR-0012 phase 3: while GitHub is still the source of truth, tell the Forge how GitHub CI ended for
# each commit of main, so GET /v1/forge/checks can compare it with the Forge's own check of the same
# commit (20 consecutive agreements are the bar for phase 4). It sends only the commit, the
# conclusion and the run id, and only with the CI service token. Cancelled or skipped runs are not
# reported. Run by hand (workflow_dispatch), it backfills the 10 newest commits of main.

on:
  workflow_run:
    workflows: ["Validate Control Plane Workers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-ci-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout the default branch (scripts only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 10
          persist-credentials: false
      - name: Report the conclusion to the Forge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          access_headers="$(mktemp)"; out="$(mktemp)"; trap 'rm -f "$access_headers" "$out"' EXIT
          .github/scripts/access-headers.sh "$access_headers"
          subdomain="$(curl --fail --silent --show-error --proto '=https' --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -er '.result.subdomain | select(test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"))')"
          report() { # sha conclusion run_id
            [[ "$1" =~ ^[0-9a-f]{40}$ && "$3" =~ ^[0-9]{1,20}$ ]] || { echo "::error::unexpected run data"; exit 1; }
            local body status
            body="$(jq -nc --arg c "$1" --arg k "$2" --arg r "$3" '{confirm:"REPORT", commit:$c, conclusion:$k, workflow_run_id:$r}')"
            status="$(curl --silent --show-error --proto '=https' --max-time 30 --request POST \
              "https://cryptophys-forge.${subdomain}.workers.dev/v1/forge/ci-report" \
              --header "@${access_headers}" --header 'content-type: application/json' --data "$body" \
              --output "$out" --write-out '%{http_code}' || true)"
            if [[ "$status" == "404" ]]; then echo "::notice::the Forge does not accept CI reports yet (HTTP 404)"; exit 0; fi
            [[ "$status" == "200" ]] || { echo "::error::ci-report returned HTTP ${status}"; exit 1; }
            echo "Reported $2 for $1 (run $3) to the Forge."
          }
          if [[ "$EVENT" == "workflow_run" ]]; then report "$HEAD_SHA" "$CONCLUSION" "$RUN_ID"; exit 0; fi
          # Backfill: the latest push run of the validation workflow for each of main's 10 newest commits.
          for sha in $(git log -10 --format=%H); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-control-plane.yml/runs?head_sha=${sha}&event=push&status=completed&per_page=1" \
              --jq '.workflow_runs[0] | select(.conclusion == "success" or .conclusion == "failure") | "\(.conclusion) \(.id)"')"
            [[ -n "$run" ]] && report "$sha" "${run%% *}" "${run##* }" || echo "No completed validation run for ${sha}."
          done
