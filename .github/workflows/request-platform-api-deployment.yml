name: Request Platform API Deployment

# Sends the authenticated POST /v1/deployments request to the Deployment
# Orchestrator. The Orchestrator, not this workflow, decides whether the commit
# may be deployed (current main, commit statuses and the latest run of every GitHub Actions workflow green,
# deployment lock) and then dispatches deploy-platform-api.yml on main.
#
# Dispatch this workflow from a dedicated request ref, never from main: a run on
# main is itself an in-progress check on the main commit, so the Orchestrator
# would correctly refuse the request as ci_not_green.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full SHA of current main to deploy"
        required: true
        type: string
      confirm_production:
        description: "Type DEPLOY to request a production deployment"
        required: true
        type: string
      orchestrator_url:
        description: "Orchestrator base URL (https://cryptophys-deployment-orchestrator.<subdomain>.workers.dev)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-platform-api-deployment-request
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout request ref (scripts only; deployment code comes from main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate request inputs
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          ORCHESTRATOR_URL: ${{ inputs.orchestrator_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_PRODUCTION" == "DEPLOY" ]] || { echo "::error::Exact confirmation DEPLOY required"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Full lowercase commit SHA required"; exit 1; }
          [[ "$ORCHESTRATOR_URL" =~ ^https://cryptophys-deployment-orchestrator\.[a-z0-9]([a-z0-9-]*[a-z0-9])?\.workers\.dev$ ]] \
            || { echo "::error::orchestrator_url must be the Orchestrator workers.dev origin"; exit 1; }
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_SHA" == "$COMMIT_SHA" ]]; then
            echo "::error::Run this from a request ref, not main: this run would be an in-progress check on ${COMMIT_SHA}."
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$COMMIT_SHA" ]] || { echo "::error::Requested ${COMMIT_SHA} but main is ${main_sha}"; exit 1; }
          echo "Requested commit is current main: ${COMMIT_SHA}"

      - name: Send authenticated deployment request
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          ORCHESTRATOR_URL: ${{ inputs.orchestrator_url }}
          ORCHESTRATOR_SHARED_SECRET: ${{ secrets.ORCHESTRATOR_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$ORCHESTRATOR_SHARED_SECRET" ]] || { echo "::error::ORCHESTRATOR_SHARED_SECRET is not available to this workflow"; exit 1; }
          [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]] || { echo "::error::Cloudflare Access service token is not available to this workflow"; exit 1; }
          access_headers="$(mktemp)"; trap 'rm -f "$access_headers"' EXIT
          "$GITHUB_WORKSPACE/.github/scripts/access-headers.sh" "$access_headers"
          body="$(jq -cn --arg sha "$COMMIT_SHA" '{commit_sha: $sha, confirm_production: "DEPLOY"}')"
          response="$(mktemp)"
          # Single attempt: a production request must not be replayed automatically.
          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 \
            --request POST "${ORCHESTRATOR_URL}/v1/deployments" \
            --header "Authorization: Bearer ${ORCHESTRATOR_SHARED_SECRET}" \
            --header "Content-Type: application/json" \
            --header "@${access_headers}" \
            --data "$body" \
            --output "$response" --write-out '%{http_code}')"
          echo "Orchestrator HTTP status: ${status}"
          echo "Orchestrator response:"
          jq . "$response" || cat "$response"
          [[ "$status" == "202" ]] || { echo "::error::Orchestrator did not accept the request (HTTP ${status})"; exit 1; }
          jq -e --arg sha "$COMMIT_SHA" '
            .status == "production_dispatch_accepted" and
            .production_deployment_triggered == true and
            .workflow == "deploy-platform-api.yml" and
            .ref == "main" and
            .requested_commit_sha == $sha' "$response" >/dev/null \
            || { echo "::error::Unexpected Orchestrator acceptance payload"; exit 1; }
          echo "Production dispatch accepted for ${COMMIT_SHA}"
