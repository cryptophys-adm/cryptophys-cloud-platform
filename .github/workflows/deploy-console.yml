name: Deploy Console

# Deploys cryptophys-console (ADR-0008, TP-023): the operator Console at console.cryptophys.work.
# It has no D1, AI or secret. It forwards the operator's own Access JWT to allow-listed routes,
# so it is deployed only after Provision Access has put it in the same Access application.

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string
      commit_sha:
        description: "Exact full commit SHA to deploy (must be the dispatch ref on main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-console-production
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact production confirmation
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deployment must be dispatched against main."; exit 1; }
          [[ "$CONFIRM_PRODUCTION" == "DEPLOY" ]] || { echo "::error::Production deployment requires the exact input DEPLOY."; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full lowercase 40-character commit SHA is required."; exit 1; }
          [[ "$COMMIT_SHA" == "$GITHUB_SHA" ]] || { echo "::error::Requested commit SHA does not match the workflow dispatch ref."; exit 1; }

  deploy:
    needs: validate-confirmation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: workers/control-plane-shared
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install the locked control-plane toolchain
        run: npm ci
      - name: Build the Console UI (React SPA served as Workers Static Assets)
        working-directory: workers/console/ui
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html
          if grep -Eq '<script>|<script [^>]*>[^<]' dist/index.html; then echo "::error::inline script in dist/index.html (breaks CSP script-src 'self')"; exit 1; fi
      - name: Type-check and test (the Console tests run against the real recovery-manager)
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
      - name: Build the Access identity allow-lists
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/access-identities.sh" "$GITHUB_ENV"'
      - name: Resolve Cloudflare Access configuration (fails closed if the Console is not protected)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          ACCESS_APP_NAME: cryptophys-cloud-platform
          EXPECTED_WORKERS: cryptophys-console
        run: '"$GITHUB_WORKSPACE/.github/scripts/resolve-access.sh"'
      - name: Wait for a deploy window outside the drift and kernel cron minutes
        run: '"$GITHUB_WORKSPACE/.github/scripts/wait-cron-window.sh"'
      - name: Capture the active Worker versions for automatic rollback (ADR-0009 §3.3)
        id: capture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" capture "$RUNNER_TEMP/rollback.json" cryptophys-console'
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config ../console/wrangler.toml --tag "${COMMIT_SHA:0:12}" --message "commit ${COMMIT_SHA}" \
            --var "ACCESS_TEAM_DOMAIN:${ACCESS_TEAM_DOMAIN}" --var "ACCESS_AUD:${ACCESS_AUD}" \
            --var "OPERATOR_IDENTITIES:${OPERATOR_IDENTITIES}" --var "APPROVER_IDENTITIES:${APPROVER_IDENTITIES}"
      - name: Attach the Nexus route nexus.cryptophys.work/console* (ADR-0010, CLOUDFLARE_ACCESS_API_TOKEN)
        # The Workers deploy token cannot hold zone route permissions, so the route is attached here
        # with the Access/D1 token through the zone routes API. Idempotent; a failure fails the deploy,
        # and the automatic rollback restores the previous Console (whose redirect is off).
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          ZONE_NAME: cryptophys.work
          ROUTE_PATTERN: nexus.cryptophys.work/console*
          SCRIPT: cryptophys-console
        run: '"$GITHUB_WORKSPACE/.github/scripts/ensure-zone-route.sh"'
      - name: Verify live health, readiness and active version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          tag="${COMMIT_SHA:0:12}"
          "$GITHUB_WORKSPACE/.github/scripts/verify-worker-live.sh" \
            --script cryptophys-console \
            --commit "$COMMIT_SHA" \
            --require-access \
            --custom-domain console.cryptophys.work \
            --health-filter ".status == \"ok\" and .service == \"cryptophys-console\" and .environment == \"production\" and .contract_version == \"v1\" and .version.tag == \"${tag}\"" \
            --ready-filter '.status == "ready" and .service == "cryptophys-console" and .production_ready == true and ([.checks[]] | all)'
      - name: Smoke-test forwarding, the allow-list and CSRF through Access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          access_headers="$(mktemp)"; out="$(mktemp)"; trap 'rm -f "$access_headers" "$out"' EXIT
          "$GITHUB_WORKSPACE/.github/scripts/access-headers.sh" "$access_headers"
          subdomain="$(curl --fail --silent --show-error --proto '=https' --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -er '.result.subdomain | select(test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"))')"
          base="https://cryptophys-console.${subdomain}.workers.dev"
          probe() { # METHOD PATH EXPECTED_STATUS JQ_FILTER [extra curl args…]
            local method="$1" path="$2" want="$3" filter="$4"; shift 4
            local status
            status="$(curl --silent --show-error --proto '=https' --max-time 30 --request "$method" "${base}${path}" \
              --header "@${access_headers}" "$@" --output "$out" --write-out '%{http_code}')"
            [[ "$status" == "$want" ]] || { echo "::error::${method} ${path}: HTTP ${status}, expected ${want}: $(head -c 300 "$out")"; exit 1; }
            jq -e "$filter" "$out" >/dev/null || { echo "::error::${method} ${path}: unexpected body: $(head -c 300 "$out")"; exit 1; }
            echo "ok ${method} ${path} -> ${status}"
          }
          # The CI service token is an operator but never an approver.
          probe GET /api/whoami 200 '.operator == true and .approver == false and .type == "service_token"'
          # Forwarding with the caller's own JWT reaches the platform Workers.
          probe GET /api/platform/v1/overview 200 '.overview | type == "object"'
          probe GET /api/kernel/v1/kernel 200 '.agents | type == "array"'
          probe GET /api/audit/v1/verify 200 '.valid == true'
          # The allow-list holds: no MCP, no raw audit append.
          probe POST /api/kernel/mcp 404 '.error == "not_allowed"' --header "Origin: ${base}" --header "x-cryptophys-console: 1"
          probe POST /api/audit/v1/events 404 '.error == "not_allowed"' --header "Origin: ${base}" --header "x-cryptophys-console: 1"
          # CSRF: a state-changing call without the console header is refused before any forward.
          probe POST /api/drift/v1/observe 403 '.error == "csrf"' --header "Origin: ${base}"
          # ADR-0010: the same Console answers under the /console mount.
          probe GET /console/api/whoami 200 '.operator == true'
          probe GET /console/api/kernel/v1/kernel 200 '.agents | type == "array"'
          # The Nexus hostname routes /console* to this Worker (route precedence over the Nexus Custom
          # Domain), and the retired console.cryptophys.work redirects there.
          # A new zone route takes up to a couple of minutes to reach every edge: retry before failing.
          for _ in $(seq 1 24); do
            nexus="$(curl --silent --show-error --proto '=https' --max-time 30 --header "@${access_headers}" --output "$out" --write-out '%{http_code}' https://nexus.cryptophys.work/console/health || true)"
            [[ "$nexus" == "200" ]] && jq -e '.service == "cryptophys-console"' "$out" >/dev/null 2>&1 && break
            sleep 5
          done
          [[ "$nexus" == "200" ]] && jq -e '.service == "cryptophys-console"' "$out" >/dev/null \
            || { echo "::error::nexus.cryptophys.work/console/health: HTTP ${nexus}: $(head -c 300 "$out")"; exit 1; }
          echo "ok GET https://nexus.cryptophys.work/console/health -> 200 (cryptophys-console)"
          legacy="$(curl --silent --show-error --proto '=https' --max-time 30 --header "@${access_headers}" --output /dev/null --write-out '%{http_code} %{redirect_url}' https://console.cryptophys.work/)"
          [[ "$legacy" == "301 https://nexus.cryptophys.work/console/" ]] || { echo "::error::console.cryptophys.work should redirect to Nexus, got: ${legacy}"; exit 1; }
          echo "ok GET https://console.cryptophys.work/ -> ${legacy}"
          printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
      - name: Record the desired version in the Platform Registry (drift baseline, TP-026)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/record-desired-version.sh" cryptophys-console "$COMMIT_SHA"'
      - name: Automatic rollback to the captured versions after a failure or cancellation
        if: always() && (failure() || cancelled()) && steps.capture.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_MESSAGE: "automatic rollback: run ${{ github.run_id }} failed verification"
        run: |
          set -euo pipefail
          # Worker versions only. D1 migrations are forward-only; the registry desired version may now
          # name the failed commit, so drift reports the mismatch until a good commit is deployed.
          "$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" restore "$RUNNER_TEMP/rollback.json"
