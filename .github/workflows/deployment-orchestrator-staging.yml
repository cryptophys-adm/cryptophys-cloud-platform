name: Deployment Orchestrator Staging Test

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Type STAGING_TEST to confirm staging-only test"
        required: true
        type: string
      commit_sha:
        description: "Exact source commit SHA under test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-staging-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate staging-only request
        shell: bash
        env:
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_STAGING" == "STAGING_TEST" ]] || { echo "Staging confirmation required"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full commit SHA required"; exit 1; }
          git init source-check
          cd source-check
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git diff --quiet
          echo "Staging-only validation completed for $COMMIT_SHA. No production workflow or deployment was invoked."
