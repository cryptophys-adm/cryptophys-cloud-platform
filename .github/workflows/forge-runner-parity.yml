name: Forge Runner Parity

# ADR-0012 phase 3: run the Forge checks (workers/forge/src/checks.ts) in local workerd, next to the
# Node suite in "Validate Control Plane Workers". Informational while the two are compared (ADR-0012
# §5c: agree on >= 20 consecutive commits); it is not part of the Orchestrator's CI gate.

on:
  pull_request:
    paths:
      - "workers/**"
      - "tools/forge-runner/**"
      - ".github/workflows/forge-runner-parity.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workerd:
    name: Control-plane tests in workerd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked toolchain (esbuild, sql.js, workerd)
        working-directory: workers/control-plane-shared
        run: npm ci
      - name: Run every control-plane test in workerd
        run: |
          set -euo pipefail
          node tools/forge-runner/run.mjs | tee "$RUNNER_TEMP/parity.txt"
          { echo "### Forge runner (workerd)"; echo '```'; head -1 "$RUNNER_TEMP/parity.txt"; grep -E '^(GAP|FAIL)' "$RUNNER_TEMP/parity.txt" | cut -c1-300 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
