name: Owner Attention

# Wave B: tell the owner when something waits for their click, so they do not have to keep the
# Console open. An issue that mentions the owner reaches GitHub email and the mobile app; no new
# secret or notification service is needed. The issue is closed when nothing waits anymore.
# Waiting means: recovery plans in draft (one approval click, then the AI runs them) and
# critical consensus proposals in pending_owner (ADR-0009 phase 4).

on:
  schedule:
    - cron: "26,56 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: owner-attention
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Owner approval needed"
  OWNER_LOGIN: cryptophys-adm
  CONSOLE: https://nexus.cryptophys.work/console/

jobs:
  attention:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout main (scripts only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read what waits for the owner
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          access="$(mktemp)"; trap 'rm -f "$access"' EXIT
          .github/scripts/access-headers.sh "$access"
          subdomain="$(curl --fail --silent --show-error --proto '=https' --max-time 20 --retry 3 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -er '.result.subdomain | select(test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"))')"
          get() { # WORKER PATH OUT
            local status
            status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 --retry 3 \
              --header "@${access}" "https://$1.${subdomain}.workers.dev$2" --output "$3" --write-out '%{http_code}')"
            [[ "$status" == "200" ]] || { echo "::error::$1$2 returned HTTP ${status}"; exit 1; }
          }
          get cryptophys-recovery-manager "/v1/plans?status=draft&limit=50" "$RUNNER_TEMP/plans.json"
          get cryptophys-ai-kernel "/v1/consensus?limit=100" "$RUNNER_TEMP/consensus.json"
          .github/scripts/owner-attention.sh "$RUNNER_TEMP/plans.json" "$RUNNER_TEMP/consensus.json" "$CONSOLE" > "$RUNNER_TEMP/attention.json"
          jq -r '"Waiting: \(.count)\n\(.markdown)"' "$RUNNER_TEMP/attention.json"

      - name: Open, update or close the owner issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/attention.json"
          count="$(jq -r .count "$a")"
          fp="$(jq -r .fingerprint "$a")"
          # shellcheck disable=SC2016 # $t is a jq variable
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title,body \
            | jq -c --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)][0] // {}')"
          number="$(jq -r '.number // empty' <<<"$issue")"
          if [[ "$count" == "0" ]]; then
            [[ -z "$number" ]] || gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Nothing waits for an approval anymore. ${RUN_URL}"
            echo "Nothing waits for the owner."
            exit 0
          fi
          body="$(jq -r --arg run "$RUN_URL" --arg owner "$OWNER_LOGIN" '
            "@\($owner) \(.count) item(s) wait for your approval click. After you approve a recovery plan, the AI runs it and shows the pipeline.\n\n\(.markdown)\n\nLast checked: \($run)\n\n<!-- attention-fingerprint:\(.fingerprint) -->"' "$a")"
          if [[ -z "$number" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          elif ! jq -e --arg fp "$fp" '.body | contains("attention-fingerprint:" + $fp)' <<<"$issue" >/dev/null; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "@${OWNER_LOGIN} the list changed:"$'\n\n'"$(jq -r .markdown "$a")"
          else
            echo "Unchanged; issue #${number} already lists it."
          fi
