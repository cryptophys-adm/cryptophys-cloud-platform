name: Diagnose Access service token

# Read-only. Explains why Cloudflare Access refuses the CI service token (HTTP 302 on the Forge
# since 2026-11-09 00:27 UTC) without printing any secret or Client ID:
#   1. which service token CF_ACCESS_CLIENT_ID names (name, expiry, last seen, last update);
#   2. whether the Access application's Service Auth policy names that token;
#   3. what the Forge answers to the CI headers (status code only);
#   4. the shape of the stored secret (length, prefix), never its value.
# It changes nothing in Access, the Workers or GitHub.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Diagnose
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: .github/scripts/access-diagnose.sh
