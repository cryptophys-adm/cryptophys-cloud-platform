name: D1 Backup

# On-demand D1 export of the control-plane database to the private R2 bucket. The primary
# daily backup is the Recovery Manager's Cloudflare-native cron (see workers/recovery-manager).
# This workflow has no schedule. After a successful manual upload it attempts to add a 90-day
# lifecycle rule, but retention is not guaranteed until that rule is verified on the bucket.
# Restoring data stays an owner decision (ADR-0009 critical class). Uses the existing tokens:
# CLOUDFLARE_ACCESS_API_TOKEN (D1 Edit) to export and CLOUDFLARE_API_TOKEN for R2 (either may
# hold R2 permissions; both are tried). Only R2-not-enabled (10042) is a warning; auth and other
# errors fail closed.
#
# Owner decision 2026-11-07 ("B, karena kedepannya kita tidak bergantung Github"): the primary
# daily backup is the Recovery Manager's Cloudflare-native backup (workers/recovery-manager/src/
# backup.ts, R2 binding, no API token). This workflow has no schedule any more; it stays for an
# on-demand `wrangler d1 export` copy (Actions → Run workflow, or an ops-dispatch request).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

env:
  D1_DATABASE_NAME: cryptophys-control-plane
  BUCKET: cryptophys-d1-backups

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: workers/control-plane-shared
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install the locked toolchain
        run: npm ci
      - name: Check that R2 is enabled and the bucket exists
        id: r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in DEPLOY_TOKEN ACCESS_TOKEN; do
            token="${!name}"
            if ! out="$(curl --silent --show-error --proto '=https' --max-time 20 --retry 3 --header "Authorization: Bearer ${token}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets?name_contains=${BUCKET}")"; then
              echo "::error::Cloudflare R2 bucket API request failed for ${name}; backup cannot proceed."
              exit 1
            fi
            if ! jq -e 'type == "object" and has("success")' <<<"$out" >/dev/null 2>&1; then
              echo "::error::Cloudflare R2 bucket API returned a non-JSON response for ${name}; backup cannot proceed."
              exit 1
            fi
            if jq -e '.success == true' <<<"$out" >/dev/null 2>&1; then
              if ! jq -e --arg b "$BUCKET" 'any(.result.buckets[]?; .name == $b)' <<<"$out" >/dev/null; then
                curl --fail --silent --show-error --proto '=https' --max-time 20 --request POST --header "Authorization: Bearer ${token}" \
                  --header "Content-Type: application/json" --data "{\"name\":\"${BUCKET}\"}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" | jq -e '.success == true' >/dev/null
                echo "Created private bucket ${BUCKET}"
              fi
              echo "token=${name}" >> "$GITHUB_OUTPUT"; echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Diagnostics: Cloudflare's error codes and messages only (never the token).
            errors="$(jq -c '[.errors[]? | {code, message}]' <<<"$out")"
            echo "${name}: ${errors}"
            # Which token is this? The token ID is not secret; the owner matches it in the dashboard
            # (user tokens: My Profile → API Tokens; account tokens: Manage Account → Account API Tokens).
            for scope in "user" "accounts/${CLOUDFLARE_ACCOUNT_ID}"; do
              v="$(curl --silent --proto '=https' --max-time 20 --header "Authorization: Bearer ${token}" \
                "https://api.cloudflare.com/client/v4/${scope}/tokens/verify" || true)"
              if jq -e '.success == true' <<<"$v" >/dev/null 2>&1; then
                echo "${name}: $( [[ $scope == user ]] && echo 'user' || echo 'account') token id $(jq -r '.result.id' <<<"$v"), status $(jq -r '.result.status' <<<"$v"), expires $(jq -r '.result.expires_on // "never"' <<<"$v")"
                break
              fi
            done
            # Validator finding (#179): only "R2 not enabled" is a non-failing skip; everything else is red.
            if jq -e '[.errors[]?.code] | length > 0 and all(. == 10042)' <<<"$out" >/dev/null 2>&1; then
              echo "::warning::R2 is not enabled on the Cloudflare account. Owner action: Cloudflare dashboard → R2 → enable (included in Workers Paid). The nightly D1 backup starts the next night."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if jq -e '[.errors[]?.code] | length > 0 and all(. == 10000)' <<<"$out" >/dev/null 2>&1; then
              echo "::warning::Cloudflare rejected ${name} authentication; trying the other configured token."
              continue
            fi
            echo "::error::Cloudflare rejected ${name} for the R2 bucket API: ${errors}"
            exit 1
          done
          echo "::error::Neither configured Cloudflare token authenticated for R2. No D1 export was created by this workflow. The Recovery Manager's hourly Cloudflare-native fallback still writes a backup when none is newer than 24 h. Owner action: add Account → Workers R2 Storage → Edit to one of the token IDs above."
          exit 1
      - name: Export D1 and upload it to R2
        if: steps.r2.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_TOKEN_NAME: ${{ steps.r2.outputs.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          file="$RUNNER_TEMP/control-plane-${stamp}.sql"
          CLOUDFLARE_API_TOKEN="$ACCESS_TOKEN" npx wrangler d1 export "$D1_DATABASE_NAME" --remote --output "$file"
          gzip -9 "$file"
          size="$(stat -c %s "${file}.gz")"; sum="$(sha256sum "${file}.gz" | cut -d' ' -f1)"
          (( size > 1000 )) || { echo "::error::export is suspiciously small (${size} bytes)"; exit 1; }
          token="${!R2_TOKEN_NAME}"
          CLOUDFLARE_API_TOKEN="$token" npx wrangler r2 object put "${BUCKET}/control-plane/${stamp}.sql.gz" --file "${file}.gz" --remote \
            --content-type application/gzip
          # Keep 90 days (idempotent; the rule is only added if it is missing).
          CLOUDFLARE_API_TOKEN="$token" npx wrangler r2 bucket lifecycle list "$BUCKET" 2>/dev/null | grep -q expire-90d \
            || CLOUDFLARE_API_TOKEN="$token" npx wrangler r2 bucket lifecycle add "$BUCKET" expire-90d control-plane/ --expire-days 90 --force \
            || echo "::warning::Could not set the 90-day lifecycle rule; set it in the dashboard."
          echo "### D1 backup" >> "$GITHUB_STEP_SUMMARY"
          echo "\`r2://${BUCKET}/control-plane/${stamp}.sql.gz\` — ${size} bytes, sha256 \`${sum}\`" >> "$GITHUB_STEP_SUMMARY"
          rm -f "${file}.gz"
