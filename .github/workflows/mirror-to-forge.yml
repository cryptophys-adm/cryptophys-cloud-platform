name: Mirror to Forge

# ADR-0012 phases 1–3 and phase-4 shadow: while GitHub is still the source of truth, push main to the Forge's Artifacts
# repository (cryptophys/platform) after every push, so both hold the same commit SHAs. The write
# token is minted by the Forge for the CI service token only, lives 10 minutes, and is masked.
# Before the Forge is deployed and has imported the repository, the run is skipped with a notice.
# Disable this workflow before the phase-4 merge cut-over; it force-updates Artifacts main from GitHub and must not run after GitHub becomes a mirror.
# Phase 4 (shadow): it then reports GitHub's outcome of change requests to the Forge: the pull
# request this commit merged (its "(#N)" subject) and recently closed unmerged pull requests, and
# deletes their cr/<number> branches.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mirror-to-forge
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main to the Forge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          access_headers="$(mktemp)"; out="$(mktemp)"; trap 'rm -f "$access_headers" "$out"' EXIT
          .github/scripts/access-headers.sh "$access_headers"
          subdomain="$(curl --fail --silent --show-error --proto '=https' --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -er '.result.subdomain | select(test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"))')"
          status="$(curl --silent --show-error --proto '=https' --max-time 30 --request POST \
            "https://cryptophys-forge.${subdomain}.workers.dev/v1/forge/mirror-token" \
            --header "@${access_headers}" --header 'content-type: application/json' --data '{"confirm":"MIRROR"}' \
            --output "$out" --write-out '%{http_code}' || true)"
          if [[ "$status" != "200" ]]; then
            if [[ "$status" == "409" || "$status" == "503" || "$status" == "404" ]]; then
              echo "::notice::the Forge is not deployed or has not imported the repository yet (HTTP ${status}); nothing to mirror"; exit 0
            fi
            echo "::error::mirror-token returned HTTP ${status}"; exit 1
          fi
          token="$(jq -er '.token' "$out")"
          remote="$(jq -er '.remote' "$out")"
          [[ "$remote" =~ ^https://[0-9a-f]{32}\.artifacts\.cloudflare\.net/git/cryptophys/platform\.git$ ]] || { echo "::error::Forge returned an untrusted Artifacts remote"; exit 1; }
          echo "::add-mask::${token}"; echo "::add-mask::${remote}"
          git -c http.extraHeader="Authorization: Bearer ${token}" push --force "$remote" "HEAD:refs/heads/main"
          echo "Mirrored main $(git rev-parse HEAD) to the Forge."
          forge="https://cryptophys-forge.${subdomain}.workers.dev"
          report_outcome() { # number merged(true|false) merge_sha
            local body status
            body="$(jq -nc --argjson n "$1" --argjson m "$2" --arg s "$3" '{confirm: "REPORT", number: $n, merged: $m} + (if $m then {merge_sha: $s} else {} end)')"
            status="$(curl --silent --show-error --proto '=https' --max-time 30 --request POST "${forge}/v1/forge/changes/outcome" \
              --header "@${access_headers}" --header 'content-type: application/json' --data "$body" \
              --output "$out" --write-out '%{http_code}' || true)"
            case "$status" in
              200) echo "Change request gh-$1: $(jq -r '.change.status + ", Forge verdict " + (.change.verdict_at_outcome // "none")' "$out")."
                   git -c http.extraHeader="Authorization: Bearer ${token}" push --quiet "$remote" ":refs/heads/cr/$1" 2>/dev/null || true ;;
              404) ;; # not a registered change request, or a Forge without change requests
              *) echo "::warning::outcome for pull request #$1 returned HTTP ${status}" ;;
            esac
          }
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ \(#([0-9]{1,8})\)$ ]]; then report_outcome "${BASH_REMATCH[1]}" true "$(git rev-parse HEAD)"; fi
          for n in $(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=10" --jq '.[] | select(.merged_at == null) | .number'); do
            report_outcome "$n" false ""
          done
