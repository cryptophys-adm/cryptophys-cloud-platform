name: Provision Cloudflare Access

# Creates or updates ONE self-hosted Cloudflare Access application that protects all
# the platform Workers (destination type `worker`, so workers.dev, previews and the
# orchestrator custom domain are all covered), with exactly two policies:
#   1. Service Auth for the CI service token (CF_ACCESS_CLIENT_ID), and
#   2. Allow for the operator emails in the ACCESS_ALLOWED_EMAILS environment variable.
# It also covers the public hostnames in PUBLIC_HOSTNAMES and the paths in PUBLIC_PATHS.
# Idempotent: re-running converges the application to this definition.

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type PROVISION to change the production Access configuration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-access-production
  cancel-in-progress: false

env:
  ACCESS_APP_NAME: cryptophys-cloud-platform
  PLATFORM_WORKERS: >-
    cryptophys-platform-api cryptophys-deployment-orchestrator cryptophys-platform-registry
    cryptophys-policy-engine cryptophys-drift-detector cryptophys-audit-ledger cryptophys-recovery-manager
    cryptophys-ai-kernel cryptophys-console cryptophys-home cryptophys-forge
  # ADR-0010 (single subdomain): Nexus, with the Console mounted at /console, is the one public
  # origin. Its hostname joins this same Access application, so one sign-in (and one AUD) covers the
  # XAUUSD room and the Console. Service bindings (drift checks) do not pass through Access.
  PUBLIC_HOSTNAMES: nexus.cryptophys.work
  # xauusd read API (owner 2026-11-08, option a): only the /api/* path of the AI Worker's custom
  # domain joins this application. The rest of that host stays public: TradingView posts to /webhook
  # (secret-protected) and deploys probe /health and /ready. Nexus and the AI Kernel read /api/* over
  # Service Bindings, which do not pass through Access. The Worker has no workers.dev or preview URL.
  PUBLIC_PATHS: ai.cryptophys.work/api/*
  # Verified after provisioning: each PATH_PROBE asks for sign-in and admits the CI token (HTTP 200);
  # each OPEN_PROBE still answers HTTP 200 without credentials (the path did not cover the host).
  PATH_PROBES: ai.cryptophys.work/api/status
  OPEN_PROBES: ai.cryptophys.work/health

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch from main only"; exit 1; }
          [[ "$CONFIRM" == "PROVISION" ]] || { echo "::error::Exact confirmation PROVISION required"; exit 1; }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Bootstrap platform Workers that do not exist yet as private 503 stubs
        # Access destinations name existing Workers. A new Worker is first created as an inert
        # stub with workers.dev disabled, so it is protected before its first real deploy.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # PLATFORM_WORKERS is a space-separated list of names
          "$GITHUB_WORKSPACE/.github/scripts/bootstrap-private-worker.sh" $PLATFORM_WORKERS

      - name: Create or update the Access application
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCESS_API_TOKEN" || { echo "::error::CLOUDFLARE_ACCESS_API_TOKEN missing"; exit 1; }
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "::error::CF_ACCESS_CLIENT_ID missing"; exit 1; }
          emails="$(printf '%s' "$ACCESS_ALLOWED_EMAILS" | tr ', ' '\n' | sed '/^$/d' | sort -u)"
          [[ -n "$emails" ]] || { echo "::error::Set the ACCESS_ALLOWED_EMAILS environment variable (comma-separated operator emails)"; exit 1; }
          while read -r e; do [[ "$e" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]] || { echo "::error::Invalid email in ACCESS_ALLOWED_EMAILS"; exit 1; }; done <<< "$emails"

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          call() { # METHOD PATH [JSON]
            local out status
            local -a data=()
            [[ $# -ge 3 ]] && data=(--data "$3")
            out="$(mktemp)"
            status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 --retry 5 --retry-delay 10 --request "$1" "${base}$2" \
              --header "Authorization: Bearer ${CLOUDFLARE_ACCESS_API_TOKEN}" --header "Content-Type: application/json" \
              "${data[@]}" --output "$out" --write-out '%{http_code}')"
            if [[ ! "$status" =~ ^2 ]] || ! jq -e '.success == true' "$out" >/dev/null; then
              echo "::error::$1 $2 returned HTTP ${status}: $(jq -c '[.errors[]? | {code, message}]' "$out" 2>/dev/null)" >&2
              exit 1
            fi
            cat "$out"
          }

          token_id="$("$GITHUB_WORKSPACE/.github/scripts/find-service-token.sh")"
          # External AI agents (ADR-0007, TP-009): service tokens named cryptophys-agent-*. Access only
          # admits them; the Workers still require an operator identity for /v1, and the AI Kernel maps
          # a registered principal to its agent at tier <= 1 on /mcp.
          agent_tokens="$("$GITHUB_WORKSPACE/.github/scripts/find-agent-service-tokens.sh")"
          scripts="$(call GET /workers/scripts)"
          # ADR-0010: sign-in through the owners' OIDC providers (Google, Microsoft Entra ID), with the
          # one-time PIN as fallback. The providers are added by the owner in Zero Trust (their client
          # secrets never pass through this repository); this step only selects the ones that exist.
          idps="$(call GET /access/identity_providers | jq -c '[.result[] | select(.type == "google" or .type == "azureAD" or .type == "oidc" or .type == "onetimepin") | {id, type, name}]')"
          jq -e 'any(.[]; .type == "google")' <<< "$idps" >/dev/null \
            || echo "::warning::No Google identity provider in Zero Trust yet; see docs/OWNER-OIDC-SETUP.md (one-time PIN still works)."
          jq -e 'any(.[]; .type == "azureAD" or .type == "oidc")' <<< "$idps" >/dev/null \
            || echo "::warning::No Microsoft identity provider (Entra ID or Microsoft OIDC) in Zero Trust yet; see docs/OWNER-OIDC-SETUP.md (one-time PIN still works)."
          # Users page (2026-11-07): people added in the Cerebrum Console sign in through the Access
          # group cryptophys-nexus-accounts. It is created here once, seeded with the configured
          # emails; afterwards the Platform Registry owns its members (never overwritten here).
          group_name="cryptophys-nexus-accounts"
          groups="$(call GET "/access/groups?per_page=1000" | jq -c --arg n "$group_name" '[.result[] | select(.name == $n)]')"
          case "$(jq length <<< "$groups")" in
            0) group="$(call POST /access/groups "$(jq -n --arg n "$group_name" --argjson emails "$(jq -R . <<< "$emails" | jq -s .)"                  '{name: $n, include: [$emails[] | {email: {email: .}}], exclude: [], require: []}')" | jq -r '.result.id')"
               echo "Created Access group ${group_name}" ;;
            1) group="$(jq -r '.[0].id' <<< "$groups")" ;;
            *) echo "::error::More than one Access group named ${group_name}; resolve manually"; exit 1 ;;
          esac
          [[ "$group" =~ ^[0-9a-f-]{20,}$ ]] || { echo "::error::Access group ${group_name} has no valid id"; exit 1; }
          destinations="[]"
          for name in $PLATFORM_WORKERS; do
            tag="$(printf '%s' "$scripts" | jq -er --arg n "$name" '[.result[] | select(.id == $n)] | if length == 1 then .[0].tag else error("missing") end')" \
              || { echo "::error::Worker ${name} not found"; exit 1; }
            destinations="$(jq -c --arg t "$tag" '. + [{type: "worker", worker_id: $t}]' <<< "$destinations")"
          done
          for host in $PUBLIC_HOSTNAMES; do
            [[ "$host" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || { echo "::error::invalid hostname ${host}"; exit 1; }
            destinations="$(jq -c --arg h "$host" '. + [{type: "public", uri: $h}]' <<< "$destinations")"
          done
          read -r -a public_paths <<< "$PUBLIC_PATHS" # an array: the paths' "*" never glob-expands
          for path in "${public_paths[@]}"; do
            # A host with a path below it (never a bare host: that would cover the whole Worker).
            [[ "$path" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+/[a-z0-9_-]+(/[a-z0-9_-]+)*(/\*)?$ ]] || { echo "::error::invalid path destination ${path}"; exit 1; }
            destinations="$(jq -c --arg p "$path" '. + [{type: "public", uri: $p}]' <<< "$destinations")"
          done

          body="$(jq -n --arg name "$ACCESS_APP_NAME" --arg token "$token_id" --arg group "$group" --argjson dest "$destinations" --argjson agents "$agent_tokens" --argjson idps "$idps" \
            --argjson emails "$(jq -R . <<< "$emails" | jq -s .)" '{
              name: $name,
              type: "self_hosted",
              destinations: $dest,
              session_duration: "8h",
              app_launcher_visible: false,
              auto_redirect_to_identity: false,
              policies: [
                {name: "ci-service-token", decision: "non_identity", precedence: 1, include: [{service_token: {token_id: $token}}]},
                {name: "platform-operators", decision: "allow", precedence: 2, include: ([$emails[] | {email: {email: .}}] + [{group: {id: $group}}])}
              ] + (if ($agents | length) > 0 then
                [{name: "external-agents", decision: "non_identity", precedence: 3, include: [$agents[] | {service_token: {token_id: .}}]}]
              else [] end)
            } + (if ($idps | length) > 0 then {allowed_idps: [$idps[].id]} else {} end)')"

          existing="$(call GET "/access/apps?per_page=1000" | jq -c --arg n "$ACCESS_APP_NAME" '[.result[] | select(.name == $n)]')"
          case "$(jq length <<< "$existing")" in
            0) result="$(call POST /access/apps "$body")"; action=created ;;
            1) result="$(call PUT "/access/apps/$(jq -r '.[0].id' <<< "$existing")" "$body")"; action=updated ;;
            *) echo "::error::More than one Access application named ${ACCESS_APP_NAME}; resolve manually"; exit 1 ;;
          esac
          jq -e --argjson n "$(( $(wc -w <<< "$PLATFORM_WORKERS") + $(wc -w <<< "$PUBLIC_HOSTNAMES") + $(wc -w <<< "$PUBLIC_PATHS") ))" '.result.aud and (.result.destinations | length == $n)' <<< "$result" >/dev/null \
            || { echo "::error::Access application response is missing its AUD or destinations"; exit 1; }
          echo "Access application ${ACCESS_APP_NAME} ${action}: $(jq -r '.result.destinations | length' <<< "$result") Workers, $(wc -l <<< "$emails") operator email(s), CI service token policy, $(jq length <<< "$agent_tokens") external agent token(s)."
          {
            echo "### Cloudflare Access"
            echo "Application \`${ACCESS_APP_NAME}\` ${action}; protects: ${PLATFORM_WORKERS}, ${PUBLIC_HOSTNAMES} and ${PUBLIC_PATHS}"
            echo "Identity providers: $(jq -r '[.[] | "\(.name) (\(.type))"] | join(", ")' <<< "$idps")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Access is enforced at the edge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "::error::CF_ACCESS_CLIENT_SECRET missing"; exit 1; }
          subdomain="$(curl --fail --silent --show-error --proto '=https' --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -er '.result.subdomain | select(test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"))')"
          headers="$(mktemp)"; trap 'rm -f "$headers"' EXIT
          "$GITHUB_WORKSPACE/.github/scripts/access-headers.sh" "$headers"
          for name in $PLATFORM_WORKERS; do
            # A Worker with workers.dev disabled (a bootstrap stub before its first deploy) has no
            # public hostname to probe; its deploy workflow verifies Access live once it is exposed.
            exposed="$(curl --fail --silent --show-error --proto '=https' --max-time 20 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${name}/subdomain" \
              | jq -r '.result.enabled | if type == "boolean" then tostring else error("subdomain.enabled is not a boolean") end')"
            if [[ "$exposed" == "false" ]]; then
              echo "${name}: workers.dev disabled (not publicly reachable); verified live by its first deploy"
              continue
            fi
            url="https://${name}.${subdomain}.workers.dev/health"
            for _ in $(seq 1 12); do
              unauth="$(curl --silent --proto '=https' --max-time 20 --output /dev/null --write-out '%{http_code}' "$url" || true)"
              [[ "$unauth" =~ ^(302|401|403)$ ]] && break
              sleep 5
            done
            [[ "$unauth" =~ ^(302|401|403)$ ]] || { echo "::error::${name} answered HTTP ${unauth} without credentials"; exit 1; }
            body="$(mktemp)"
            authed="$(curl --silent --proto '=https' --max-time 20 --header "@$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            # The token must get past Access to the Worker: HTTP 200, or (before the Worker is redeployed
            # with ACCESS_* vars) the Worker's own JSON 503 access_not_configured. Access's own denials are not JSON.
            if [[ "$authed" == "200" ]] || { [[ "$authed" == "503" ]] && jq -e '.error == "access_not_configured"' "$body" >/dev/null 2>&1; }; then
              :
            else
              echo "::error::${name}: service token was not admitted to the Worker (HTTP ${authed})"; exit 1
            fi
            echo "${name}: unauthenticated HTTP ${unauth}, service token HTTP ${authed}"
          done
          # ADR-0010: every public hostname now asks for sign-in at the edge; the CI token gets through.
          for host in $PUBLIC_HOSTNAMES; do
            for _ in $(seq 1 12); do
              unauth="$(curl --silent --proto '=https' --max-time 20 --output /dev/null --write-out '%{http_code}' "https://${host}/" || true)"
              [[ "$unauth" =~ ^(302|401|403)$ ]] && break
              sleep 5
            done
            [[ "$unauth" =~ ^(302|401|403)$ ]] || { echo "::error::${host} answered HTTP ${unauth} without credentials"; exit 1; }
            authed="$(curl --silent --proto '=https' --max-time 20 --header "@$headers" --output /dev/null --write-out '%{http_code}' "https://${host}/" || true)"
            [[ "$authed" == "200" ]] || { echo "::error::${host}: service token was not admitted (HTTP ${authed})"; exit 1; }
            echo "${host}: unauthenticated HTTP ${unauth}, service token HTTP ${authed}"
          done
          # Path destinations: the path asks for sign-in and admits the CI token; the rest of the host is untouched.
          for probe in $PATH_PROBES; do
            for _ in $(seq 1 12); do
              unauth="$(curl --silent --proto '=https' --max-time 20 --output /dev/null --write-out '%{http_code}' "https://${probe}" || true)"
              [[ "$unauth" =~ ^(302|401|403)$ ]] && break
              sleep 5
            done
            [[ "$unauth" =~ ^(302|401|403)$ ]] || { echo "::error::${probe} answered HTTP ${unauth} without credentials"; exit 1; }
            authed="$(curl --silent --proto '=https' --max-time 20 --header "@$headers" --output /dev/null --write-out '%{http_code}' "https://${probe}" || true)"
            [[ "$authed" == "200" ]] || { echo "::error::${probe}: service token was not admitted (HTTP ${authed})"; exit 1; }
            echo "${probe}: unauthenticated HTTP ${unauth}, service token HTTP ${authed}"
          done
          for probe in $OPEN_PROBES; do
            open="$(curl --silent --proto '=https' --max-time 20 --output /dev/null --write-out '%{http_code}' "https://${probe}" || true)"
            [[ "$open" == "200" ]] || { echo "::error::${probe} must stay public but answered HTTP ${open} without credentials"; exit 1; }
            echo "${probe}: public, HTTP ${open}"
          done
