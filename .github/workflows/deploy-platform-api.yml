name: Deploy Platform API

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string
      commit_sha:
        description: "Exact full commit SHA validated by the deployment orchestrator"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-platform-api-production
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact production confirmation
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deployment must be dispatched against main."; exit 1; }
          if [[ "$CONFIRM_PRODUCTION" != "DEPLOY" ]]; then
            echo "Production deployment requires the exact input DEPLOY."
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full lowercase 40-character commit SHA is required."
            exit 1
          fi
          if [[ "$COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Requested commit SHA does not match the workflow dispatch ref."
            exit 1
          fi

  deploy:
    needs: validate-confirmation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Verify deployment configuration and build the Access identity allow-lists
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          # GET /v1/overview is authorized by Cloudflare Access identity, like every control-plane /v1.
          "$GITHUB_WORKSPACE/.github/scripts/access-identities.sh" "$GITHUB_ENV"
          npx wrangler whoami
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
      - name: Resolve the control-plane D1 database by exact name and render the deploy config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}  # D1 Edit (owner decision); Workers deploy keeps CLOUDFLARE_API_TOKEN
          D1_DATABASE_NAME: cryptophys-control-plane
        run: '"$GITHUB_WORKSPACE/.github/scripts/render-d1-config.sh" .'

      - name: Resolve Cloudflare Access configuration (fails closed if the Workers are not protected)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          ACCESS_APP_NAME: cryptophys-cloud-platform
          EXPECTED_WORKERS: cryptophys-platform-api
        run: '"$GITHUB_WORKSPACE/.github/scripts/resolve-access.sh"'
      - name: Wait for a deploy window outside the drift and kernel cron minutes
        run: '"$GITHUB_WORKSPACE/.github/scripts/wait-cron-window.sh"'
      - name: Capture the active Worker versions for automatic rollback (ADR-0009 §3.3)
        id: capture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" capture "$RUNNER_TEMP/rollback.json" cryptophys-platform-api'
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.toml --tag "${COMMIT_SHA:0:12}" --message "commit ${COMMIT_SHA}" --var "ACCESS_TEAM_DOMAIN:${ACCESS_TEAM_DOMAIN}" --var "ACCESS_AUD:${ACCESS_AUD}" --var "OPERATOR_IDENTITIES:${OPERATOR_IDENTITIES}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
      - name: Verify live health, readiness and active version
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/verify-worker-live.sh" \
            --script cryptophys-platform-api \
            --commit "$COMMIT_SHA" \
            --require-access \
            --health-filter '.status == "ok" and .service == "cryptophys-cloud-platform" and .environment == "production" and .contract_version == "v1"' \
            --ready-filter '.status == "ready" and .service == "cryptophys-cloud-platform" and .production_ready == true and ([.checks[]] | all)'
          printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
      - name: Record the desired version in the Platform Registry (drift baseline)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/record-desired-version.sh" cryptophys-platform-api "$COMMIT_SHA"'
      - name: Automatic rollback to the captured versions after a failure or cancellation
        if: always() && (failure() || cancelled()) && steps.capture.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_MESSAGE: "automatic rollback: run ${{ github.run_id }} failed verification"
        run: |
          set -euo pipefail
          # Worker versions only. D1 migrations are forward-only; the registry desired version may now
          # name the failed commit, so drift reports the mismatch until a good commit is deployed.
          "$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" restore "$RUNNER_TEMP/rollback.json"
