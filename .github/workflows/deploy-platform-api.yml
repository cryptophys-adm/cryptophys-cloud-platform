name: Deploy Platform API

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string
      commit_sha:
        description: "Exact full commit SHA validated by the deployment orchestrator"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-platform-api-production
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact production confirmation
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployment must be dispatched against main."
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != "DEPLOY" ]]; then
            echo "Production deployment requires the exact input DEPLOY."
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full lowercase 40-character commit SHA is required."
            exit 1
          fi
          if [[ "$COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Requested commit SHA does not match the workflow dispatch ref."
            exit 1
          fi

  deploy:
    needs: validate-confirmation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Verify deployment configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live health and readiness
        shell: bash
        run: |
          set -euo pipefail

          account_subdomain="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -er '.result.subdomain')"

          base_url="https://cryptophys-platform-api.${account_subdomain}.workers.dev"

          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "${base_url}/health")"
          printf '%s' "$health" | jq -e '
            .status == "ok" and
            .service == "cryptophys-cloud-platform" and
            .environment == "production" and
            .contract_version == "v1"
          '

          readiness="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "${base_url}/ready")"
          printf '%s' "$readiness" | jq -e '
            .status == "ready" and
            .service == "cryptophys-cloud-platform" and
            (.dependencies | length == 0)
          '

          deployment_version="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-platform-api/versions" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -er '.result.items[0].id')"

          printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          printf 'Active Worker version: %s\n' "$deployment_version"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
