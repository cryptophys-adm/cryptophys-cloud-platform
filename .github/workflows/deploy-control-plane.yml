name: Deploy Control Plane

# Production deployment of the five control-plane service Workers and the AI Kernel from one exact main commit; type-check, tests and migration validation
# run before production credentials are used.
# The five control-plane services are Platform Registry, Policy Engine, Audit Ledger,
# Recovery Manager and Drift Detector. The AI Kernel also deploys here. The crypto Signal
# Engine was retired on 2026-11-05 (TP-018) and is no longer deployed.
# The Deployment Orchestrator and Platform API keep their own workflows.
#
# Order matters: service bindings require their targets to exist. Policy Engine deploys
# before Recovery Manager; Drift Detector deploys before the AI Kernel (DriftRpc, ADR-0009 phase 2).

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to deploy the control plane to production"
        required: true
        type: string
      commit_sha:
        description: "Exact full commit SHA of main to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-control-plane-production
  cancel-in-progress: false

env:
  D1_DATABASE_NAME: cryptophys-control-plane
  DEPLOY_ORDER: "policy-engine audit-ledger platform-registry recovery-manager drift-detector ai-kernel"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit production confirmation and immutable SHA
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch from main only"; exit 1; }
          [[ "$CONFIRM_PRODUCTION" == "DEPLOY" ]] || { echo "::error::Exact confirmation DEPLOY required"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Full lowercase commit SHA required"; exit 1; }
          [[ "$COMMIT_SHA" == "$GITHUB_SHA" ]] || { echo "::error::Commit SHA must equal the workflow dispatch ref"; exit 1; }

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: workers/control-plane-shared
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install locked toolchain
        run: npm ci

      - name: Type-check, test and validate migrations before credentials are used
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          python3 ../control-plane-migrations/test_migrations.py

      - name: Verify credentials and build the Access identity allow-lists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          # /v1 is authorized by Cloudflare Access identity (ADR-0004 decision 4): operators are the
          # CI service token + operator emails; recovery approvers are the operator emails.
          "$GITHUB_WORKSPACE/.github/scripts/access-identities.sh" "$GITHUB_ENV"
          npx wrangler whoami

      - name: Resolve the control-plane D1 database by exact name and render deploy configs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}  # D1 Edit (owner decision); Workers deploy keeps CLOUDFLARE_API_TOKEN
        run: |
          set -euo pipefail
          dirs=()
          for dir in $DEPLOY_ORDER; do dirs+=("../$dir"); done
          "$GITHUB_WORKSPACE/.github/scripts/render-d1-config.sh" "${dirs[@]}"

      - name: Preflight and ensure the agent-memory Vectorize index before D1 migrations or Worker deployment (never modifies or deletes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Either existing token may hold Vectorize permissions; try both, fail closed if neither works.
          if CLOUDFLARE_API_TOKEN="$ACCESS_TOKEN" "$GITHUB_WORKSPACE/.github/scripts/ensure-vectorize-index.sh"; then exit 0; fi
          echo "::notice::Retrying the Vectorize check with the Workers deploy token."
          CLOUDFLARE_API_TOKEN="$DEPLOY_TOKEN" "$GITHUB_WORKSPACE/.github/scripts/ensure-vectorize-index.sh"

      - name: Resolve Cloudflare Access configuration (fails closed if the Workers are not protected)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          ACCESS_APP_NAME: cryptophys-cloud-platform
          EXPECTED_WORKERS: "cryptophys-platform-registry cryptophys-policy-engine cryptophys-audit-ledger cryptophys-recovery-manager cryptophys-ai-kernel cryptophys-drift-detector"
        run: '"$GITHUB_WORKSPACE/.github/scripts/resolve-access.sh"'

      - name: Record a D1 Time Travel restore point before migrating
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}  # D1 Edit (owner decision); Workers deploy keeps CLOUDFLARE_API_TOKEN
        run: |
          set -euo pipefail
          info="$(npx wrangler d1 time-travel info "$D1_DATABASE_NAME" --json --config ../audit-ledger/wrangler.deploy.toml)"
          bookmark="$(printf '%s' "$info" | jq -er '.bookmark')"
          echo "Pre-migration D1 bookmark: ${bookmark}"
          echo "Restore with: wrangler d1 time-travel restore ${D1_DATABASE_NAME} --bookmark=${bookmark}"
          echo "### D1 restore point" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${bookmark}\` (commit ${{ inputs.commit_sha }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}  # D1 Edit (owner decision); Workers deploy keeps CLOUDFLARE_API_TOKEN
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config ../audit-ledger/wrangler.deploy.toml
          npx wrangler d1 migrations list "$D1_DATABASE_NAME" --remote --config ../audit-ledger/wrangler.deploy.toml

      - name: Wait for a deploy window outside the drift and kernel cron minutes
        run: '"$GITHUB_WORKSPACE/.github/scripts/wait-cron-window.sh"'
      - name: Capture the active Worker versions for automatic rollback (ADR-0009 §3.3)
        id: capture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          workers=(); for d in $DEPLOY_ORDER; do workers+=("cryptophys-${d}"); done
          "$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" capture "$RUNNER_TEMP/rollback.json" "${workers[@]}"
      - name: Deploy and verify each Worker live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          tag="${COMMIT_SHA:0:12}"
          for dir in $DEPLOY_ORDER; do
            name="cryptophys-${dir}"
            vars=(--var "ACCESS_TEAM_DOMAIN:${ACCESS_TEAM_DOMAIN}" --var "ACCESS_AUD:${ACCESS_AUD}" --var "OPERATOR_IDENTITIES:${OPERATOR_IDENTITIES}")
            [[ "$dir" == "recovery-manager" || "$dir" == "ai-kernel" || "$dir" == "platform-registry" ]] && vars+=(--var "APPROVER_IDENTITIES:${APPROVER_IDENTITIES}")
            # Users page (2026-11-07): the Registry syncs Nexus sign-in to the Access group with the Worker
            # secret ACCESS_GROUPS_TOKEN (set by the owner; wrangler keeps it); the account ID is not secret.
            [[ "$dir" == "platform-registry" ]] && vars+=(--var "CF_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID}")
            echo "::group::Deploy ${name}"
            # Wrangler preserves secret bindings; remove only the retired shared-token names that the current identity-auth code no longer reads.
            "$GITHUB_WORKSPACE/.github/scripts/remove-worker-secrets.sh" "$name" ADMIN_TOKEN APPROVER_TOKEN
            npx wrangler deploy --config "../${dir}/wrangler.deploy.toml" --tag "$tag" --message "commit ${COMMIT_SHA}" "${vars[@]}"
            curl --fail --silent --show-error --proto '=https' --max-time 20 --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${name}/settings" \
              | jq -e '[.result.bindings[] | select(.name == "ADMIN_TOKEN" or .name == "APPROVER_TOKEN")] | length == 0' >/dev/null \
              || { echo "::error::${name} still has a retired shared token bound"; exit 1; }
            "$GITHUB_WORKSPACE/.github/scripts/verify-worker-live.sh" \
              --script "$name" \
              --commit "$COMMIT_SHA" \
              --require-access \
              --health-filter ".status == \"ok\" and .service == \"${name}\" and .environment == \"production\" and .contract_version == \"v1\" and .version.tag == \"${tag}\"" \
              --ready-filter ".status == \"ready\" and .service == \"${name}\" and .production_ready == true and ([.checks[]] | all)"
            echo "::endgroup::"
          done

      - name: Record desired versions, observe drift and verify the audit chain end to end
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          tag="${COMMIT_SHA:0:12}"
          access_headers="$(mktemp)"; trap 'rm -f "$access_headers"' EXIT
          "$GITHUB_WORKSPACE/.github/scripts/access-headers.sh" "$access_headers"
          subdomain="$(curl --fail --silent --show-error --proto '=https' --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -er '.result.subdomain | select(test("^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"))')"
          url() { printf 'https://cryptophys-%s.%s.workers.dev' "$1" "$subdomain"; }
          api() { # METHOD URL [JSON]
            local out status
            local -a data=()
            [[ $# -ge 3 ]] && data=(--data "$3")
            out="$(mktemp)"
            status="$(curl --silent --show-error --proto '=https' --max-time 30 --request "$1" "$2" \
              --header "Content-Type: application/json" --header "@${access_headers}" "${data[@]}" \
              --output "$out" --write-out '%{http_code}')"
            [[ "$status" =~ ^2 ]] || { echo "::error::$1 $2 returned HTTP $status: $(head -c 1000 "$out")"; exit 1; }
            cat "$out"
          }
          registry="$(url platform-registry)"
          for dir in $DEPLOY_ORDER; do
            api PUT "${registry}/v1/services/cryptophys-${dir}/desired-version" \
              "$(jq -cn --arg v "$tag" '{desired_version: $v}')" \
              | jq -e --arg v "$tag" '.service.desired_version == $v' >/dev/null
          done
          echo "Desired version ${tag} recorded for: ${DEPLOY_ORDER}"

          report="$(api POST "$(url drift-detector)/v1/observe" '{}')"
          printf '%s' "$report" | jq '{run_id, drifted, services: [.services[] | {service_id, desired_version, observed_version, drifted, reasons, status}]}'
          for dir in $DEPLOY_ORDER; do
            printf '%s' "$report" | jq -e --arg s "cryptophys-${dir}" --arg v "$tag" \
              '.services[] | select(.service_id == $s) | .drifted == false and .observed_version == $v and .status == "healthy"' >/dev/null \
              || { echo "::error::cryptophys-${dir} is drifted or unhealthy after deployment"; exit 1; }
          done

          api POST "$(url audit-ledger)/v1/events" "$(jq -cn --arg sha "$COMMIT_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg order "$DEPLOY_ORDER" \
            '{event_type: "deployment.control_plane_completed", subject: "control-plane", outcome: "success", payload: {commit_sha: $sha, workflow_run: $run, workers: ($order | split(" "))}}')" \
            | jq '{event_id: .event.event_id, event_hash: .event.event_hash}'
          api GET "$(url audit-ledger)/v1/verify" | tee /dev/stderr | jq -e '.valid == true and .events_checked > 0' >/dev/null

          policy="$(api POST "$(url policy-engine)/v1/evaluate" "$(jq -cn --arg sha "$COMMIT_SHA" \
            '{action: "deploy", resource: "cryptophys-platform-api", context: {commit_sha: $sha, confirm_production: "DEPLOY", ci_green: false, deploy_verification: true}}')")"
          printf '%s' "$policy" | jq -e '.decision == "deny" and (.reason | test("ci_green"))' >/dev/null \
            || { echo "::error::Policy Engine did not deny a deployment with failing CI"; exit 1; }

          # Recovery lifecycle Workflow end to end (ADR-0006). CI is an operator, never an approver:
          # it can only create and disable a plan, so this proves the instance is started and
          # terminated in production without approving or executing anything.
          plan="$(api POST "$(url recovery-manager)/v1/plans" "$(jq -cn --arg sha "$COMMIT_SHA" \
            '{service_id: "cryptophys-recovery-manager", plan_version: $sha[0:12], title: "Deploy verification: recovery lifecycle Workflow",
              rationale: "Created and disabled by the deploy workflow to verify the lifecycle Workflow. Never approved or executed.",
              steps: [{action: "manual", description: "No action: verification plan"}]}')")"
          plan_id="$(printf '%s' "$plan" | jq -er '.plan.plan_id')"
          instance="$(printf '%s' "$plan" | jq -er --arg id "$plan_id" '.plan | select(.workflow_instance_id == $id and (.approve_by | type == "string")) | .workflow_instance_id')" \
            || { echo "::error::Plan ${plan_id} has no lifecycle Workflow instance or deadline"; exit 1; }
          wf_status() {
            curl --fail --silent --show-error --proto '=https' --max-time 20 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/cryptophys-recovery-lifecycle/instances/${instance}" \
              | jq -er '.result.status'
          }
          state=""
          for _ in $(seq 1 10); do state="$(wf_status || true)"; [[ "$state" =~ ^(running|waiting)$ ]] && break; sleep 3; done
          [[ "$state" =~ ^(running|waiting)$ ]] || { echo "::error::Lifecycle instance ${instance} is '${state}', expected running or waiting"; exit 1; }
          echo "Lifecycle instance ${instance} is ${state}"
          api POST "$(url recovery-manager)/v1/plans/${plan_id}/disable" '{}' \
            | jq -e '.plan.status == "disabled" and .plan.disabled_reason == "operator"' >/dev/null
          for _ in $(seq 1 10); do state="$(wf_status || true)"; [[ "$state" == "terminated" ]] && break; sleep 3; done
          [[ "$state" == "terminated" ]] || { echo "::error::Lifecycle instance ${instance} is '${state}' after disable, expected terminated"; exit 1; }
          echo "Recovery lifecycle verified: plan ${plan_id} started instance ${instance}, disabling it terminated the instance."

          # AI Worker OS kernel (ADR-0007): MCP front door answers, the supervisor is registered at
          # tier 1 (TP-022) with the kill switch on, and a supervisor cycle completes with an observation.
          kernel="$(url ai-kernel)"
          api POST "${kernel}/mcp" '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | jq -e '[.result.tools[].name] | index("platform_status") != null and index("set_agents_enabled") != null' >/dev/null \
            || { echo "::error::Kernel MCP tools/list did not answer"; exit 1; }
          api GET "${kernel}/v1/kernel" \
            | jq -e '.agents_enabled == true and ([.agents[] | select(.agent_id == "supervisor" and .tier_max == 1 and .status == "enabled")] | length == 1) and ([.agents[] | select(.tier_max >= 2)] | length == 0)' >/dev/null \
            || { echo "::error::Supervisor agent is not registered and enabled"; exit 1; }
          # ADR-0009: the consensus engine answers in a known mode (set by a person in the Console), and no
          # execution is stuck: nothing has been "executing" for more than 30 minutes.
          api GET "${kernel}/v1/consensus?limit=50" \
            | jq -e --arg cutoff "$(date -u -d '-30 minutes' +%Y-%m-%dT%H:%M:%S)" '(.mode | IN("shadow", "routine", "deploy", "critical")) and ([.proposals[] | select(.status == "executing" and .decided_at < $cutoff)] | length == 0)' >/dev/null \
            || { echo "::error::Consensus engine answered an unknown mode or an execution is stuck"; exit 1; }
          cycle="$(api POST "${kernel}/v1/agents/supervisor/wake" '{}')"
          printf '%s' "$cycle" | jq '{trigger, skipped, findings}'
          printf '%s' "$cycle" | jq -e '.trigger == "operator" and (.skipped | not) and ([.actions[] | select(.capability == "platform.observe" and .outcome == "succeeded")] | length == 1)' >/dev/null \
            || { echo "::error::Supervisor cycle did not complete an observation"; exit 1; }
          # TP-015: the observation carries a bounded 24 h agent report summary (counts only are printed).
          api GET "${kernel}/v1/status" | jq -e '.agent_reports_24h | (.counts | has("critical") and has("warning") and has("info")) and (.latest_attention | type == "array" and length <= 5) and (.latest_critical | type == "array" and length <= 5) and (.critical_fingerprint | type == "string" and test("^[0-9a-f]{64}$")) and (has("error") | not)' >/dev/null \
            || { echo "::error::Kernel observation lacks a healthy agent_reports_24h summary"; exit 1; }
          # TP-019: the observation carries the latest XAUUSD decision as six fields (no reasoning or prices), or null.
          api GET "${kernel}/v1/status" | jq -e 'has("xauusd_latest") and (.xauusd_latest == null or ((.xauusd_latest | keys) == ["candle_key","confidence","decided_at","decision","report_id","reported_at"] and (.xauusd_latest.decision | IN("BUY","SELL","WAIT","NO_TRADE","UNKNOWN"))))' >/dev/null \
            || { echo "::error::Kernel observation lacks a well-formed xauusd_latest"; exit 1; }
          api GET "${kernel}/v1/status" | jq -c '{agent_reports_24h: {since: .agent_reports_24h.since, counts: .agent_reports_24h.counts}, xauusd_latest: (.xauusd_latest | if . == null then null else {decision, confidence, candle_key} end)}'
          echo "AI kernel verified: MCP, agent registry, a supervisor cycle and the report summary."
          echo "Control plane ${tag} deployed, registered, observed in sync, audited and policy-verified."
          echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Automatic rollback to the captured versions after a failure or cancellation
        if: always() && (failure() || cancelled()) && steps.capture.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_MESSAGE: "automatic rollback: run ${{ github.run_id }} failed verification"
        run: |
          set -euo pipefail
          # Worker versions only. D1 migrations are forward-only; the registry desired version may now
          # name the failed commit, so drift reports the mismatch until a good commit is deployed.
          "$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" restore "$RUNNER_TEMP/rollback.json"
