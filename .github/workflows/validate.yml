name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-api:
    name: Type-check platform API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/platform-api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Validate Cloudflare Worker deployment configuration
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cryptophys-platform-api-dry-run"

  deployment-orchestrator:
    name: Type-check deployment orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/deployment-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck

  deployment-verification-script:
    name: Test deployment verification script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Shellcheck
        run: shellcheck .github/scripts/*.sh
      - name: Run hermetic tests
        run: |
          bash .github/scripts/verify-worker-live.test.sh
          bash .github/scripts/render-d1-config.test.sh
          bash .github/scripts/resolve-access.test.sh
          bash .github/scripts/find-service-token.test.sh
          bash .github/scripts/access-headers.test.sh
          bash .github/scripts/access-identities.test.sh
          bash .github/scripts/drift-summary.test.sh
          bash .github/scripts/report-summary.test.sh
          bash .github/scripts/bootstrap-private-worker.test.sh
          bash .github/scripts/ensure-vectorize-index.test.sh
          bash .github/scripts/find-agent-service-tokens.test.sh
