name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-api:
    name: Type-check platform API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/platform-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck

  deployment-orchestrator:
    name: Type-check deployment orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/deployment-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
