name: Deploy Control Plane Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Select exactly one Control Plane Worker"
        required: true
        type: choice
        options:
          - cryptophys-platform-registry
          - cryptophys-deployment-orchestrator
          - cryptophys-policy-engine
          - cryptophys-drift-detector
          - cryptophys-audit-ledger
          - cryptophys-recovery-manager
      confirm_production:
        description: "Type DEPLOY to deploy the selected Worker from reviewed Git source"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: control-plane-${{ inputs.worker }}-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and explicit production confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production deployment may only be dispatched from main."
            exit 1
          }
          [[ "$CONFIRM_PRODUCTION" == "DEPLOY" ]] || {
            echo "Production deployment requires the exact input DEPLOY."
            exit 1
          }

      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve selected Worker configuration
        id: target
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            cryptophys-platform-registry) dir="platform-registry" ;;
            cryptophys-deployment-orchestrator) dir="deployment-orchestrator" ;;
            cryptophys-policy-engine) dir="policy-engine" ;;
            cryptophys-drift-detector) dir="drift-detector" ;;
            cryptophys-audit-ledger) dir="audit-ledger" ;;
            cryptophys-recovery-manager) dir="recovery-manager" ;;
            *) echo "Unrecognized Worker"; exit 1 ;;
          esac
          config="$GITHUB_WORKSPACE/workers/$dir/wrangler.toml"
          test -f "$config"
          test -f "$GITHUB_WORKSPACE/workers/$dir/src/index.ts"
          grep -Eq '^[[:space:]]*SERVICE_ENVIRONMENT[[:space:]]*=[[:space:]]*"production"[[:space:]]*$' "$config" || {
            echo "Refusing deployment: $WORKER must explicitly declare SERVICE_ENVIRONMENT = production."
            exit 1
          }
          grep -Eq '^[[:space:]]*SERVICE_CONFIGURED[[:space:]]*=[[:space:]]*"false"[[:space:]]*$' "$config" || {
            echo "Refusing scaffold deployment unless SERVICE_CONFIGURED remains false."
            exit 1
          }
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install locked toolchain and type-check all Control Plane Workers
        working-directory: workers/platform-api
        run: |
          set -euo pipefail
          test -f package-lock.json || {
            echo "Refusing production deployment until workers/platform-api/package-lock.json is committed and reviewed."
            exit 1
          }
          npm ci
          npx tsc --noEmit -p ../control-plane-tsconfig.json

      - name: Validate selected Worker bundle before credentials are exposed
        working-directory: workers/platform-api
        env:
          CONFIG_PATH: ${{ steps.target.outputs.config }}
          WORKER: ${{ steps.target.outputs.worker }}
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config "$CONFIG_PATH" --outdir "/tmp/cryptophys-$WORKER-dry-run"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve selected source directory
        id: target
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            cryptophys-platform-registry) dir="platform-registry" ;;
            cryptophys-deployment-orchestrator) dir="deployment-orchestrator" ;;
            cryptophys-policy-engine) dir="policy-engine" ;;
            cryptophys-drift-detector) dir="drift-detector" ;;
            cryptophys-audit-ledger) dir="audit-ledger" ;;
            cryptophys-recovery-manager) dir="recovery-manager" ;;
            *) echo "Unrecognized Worker"; exit 1 ;;
          esac
          config="$GITHUB_WORKSPACE/workers/$dir/wrangler.toml"
          test -f "$config"
          test -f "$GITHUB_WORKSPACE/workers/$dir/src/index.ts"
          grep -Eq '^[[:space:]]*SERVICE_ENVIRONMENT[[:space:]]*=[[:space:]]*"production"[[:space:]]*$' "$config"
          grep -Eq '^[[:space:]]*SERVICE_CONFIGURED[[:space:]]*=[[:space:]]*"false"[[:space:]]*$' "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install the locked toolchain
        working-directory: workers/platform-api
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: workers/platform-api
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami

      - name: Deploy selected Worker from repository source
        env:
          CONFIG_PATH: ${{ steps.target.outputs.config }}
        working-directory: workers/platform-api
        run: npx wrangler deploy --config "$CONFIG_PATH"

      - name: Verify deployed health contract
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER: ${{ steps.target.outputs.worker }}
        run: |
          set -euo pipefail
          subdomain="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -er '.result.subdomain')"
          base="https://${WORKER}.${subdomain}.workers.dev"
          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "${base}/health")"
          printf '%s' "$health" | jq -e --arg service "$WORKER" '
            .status == "ok" and
            .service == $service and
            .environment == "production" and
            .contract_version == "v1"
          '
          readiness_code="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 \
            --output /tmp/readiness.json --write-out '%{http_code}' "${base}/ready")"
          [[ "$readiness_code" == "503" ]] || {
            echo "Foundation Worker must remain not_configured; unexpected readiness HTTP status: $readiness_code"
            cat /tmp/readiness.json
            exit 1
          }
          jq -e '.status == "not_configured" and .production_ready == false' /tmp/readiness.json
          echo "Deployment verified as source-aligned scaffold; operational readiness remains blocked."
