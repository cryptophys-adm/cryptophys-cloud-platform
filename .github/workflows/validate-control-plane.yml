name: Validate Control Plane Workers

# One validation workflow for the repository (2026-11-08: the former validate.yml jobs live here too).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-control-plane:
    name: Type-check, test and bundle Control Plane Worker services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/control-plane-shared
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked toolchain
        run: npm ci
      - name: Build the Console UI (React SPA served as Workers Static Assets)
        working-directory: workers/console/ui
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html
          if grep -Eq '<script>|<script [^>]*>[^<]' dist/index.html; then echo "::error::inline script in dist/index.html (breaks CSP script-src 'self')"; exit 1; fi
      - name: Render every Console screen in Chromium at 390 px and 1440 px under /console/ (Wave C)
        working-directory: workers/console/ui
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run render-smoke
      - name: Type-check six Control Plane Workers and shared library
        run: npm run typecheck
      - name: Endpoint and library tests against the real D1 migrations
        run: npm test
      - name: Migration tests (isolated SQLite)
        run: python3 ../control-plane-migrations/test_migrations.py
      - name: Bundle every control-plane Worker (dry run, no credentials)
        run: |
          set -euo pipefail
          for dir in platform-registry policy-engine audit-ledger recovery-manager ai-kernel drift-detector platform-api console home forge; do
            npx wrangler deploy --dry-run --config "../${dir}/wrangler.toml" --outdir "$RUNNER_TEMP/dry-run-${dir}"
          done
          # The Forge ships its runner shims as Text modules (wrangler.toml [[rules]]). If the rule
          # stopped matching, Wrangler would inline them as code and every Forge check would fail.
          shims="$(find "$RUNNER_TEMP/dry-run-forge" -maxdepth 1 -name '*-node-*.js' | wc -l)"
          if [ "$shims" -ne 5 ]; then
            echo "::error::expected the 5 Forge runner shims as separate text modules, found ${shims}" >&2
            exit 1
          fi

  platform-api:
    name: Type-check platform API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/platform-api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Validate Cloudflare Worker deployment configuration
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cryptophys-platform-api-dry-run"

  deployment-orchestrator:
    name: Type-check deployment orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/deployment-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck

  deployment-verification-script:
    name: Test deployment verification script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck
        run: shellcheck .github/scripts/*.sh
      - name: Run hermetic tests
        run: |
          bash .github/scripts/verify-worker-live.test.sh
          bash .github/scripts/render-d1-config.test.sh
          bash .github/scripts/resolve-access.test.sh
          bash .github/scripts/find-service-token.test.sh
          bash .github/scripts/access-headers.test.sh
          bash .github/scripts/access-identities.test.sh
          bash .github/scripts/bootstrap-private-worker.test.sh
          bash .github/scripts/ensure-vectorize-index.test.sh
          bash .github/scripts/worker-rollback.test.sh
          bash .github/scripts/wait-cron-window.test.sh
          bash .github/scripts/ensure-zone-route.test.sh
          bash .github/scripts/find-agent-service-tokens.test.sh
          bash .github/scripts/access-diagnose.test.sh
