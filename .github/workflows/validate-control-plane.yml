name: Validate Control Plane Workers

on:
  pull_request:
    paths:
      - "workers/**"
      - "docs/CONTROL-PLANE-WORKERS.md"
      - ".github/workflows/validate-control-plane.yml"
      - ".github/workflows/deploy-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "docs/CONTROL-PLANE-WORKERS.md"
      - ".github/workflows/validate-control-plane.yml"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-control-plane:
    name: Type-check, test and bundle Control Plane Worker services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/control-plane-shared
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked toolchain
        run: npm ci
      - name: Type-check six Control Plane Workers and shared library
        run: npm run typecheck
      - name: Endpoint and library tests against the real D1 migrations
        run: npm test
      - name: Migration tests (isolated SQLite)
        run: python3 ../control-plane-migrations/test_migrations.py
      - name: Bundle every control-plane Worker (dry run, no credentials)
        run: |
          set -euo pipefail
          for dir in platform-registry policy-engine audit-ledger recovery-manager drift-detector; do
            npx wrangler deploy --dry-run --config "../${dir}/wrangler.toml" --outdir "$RUNNER_TEMP/dry-run-${dir}"
          done
