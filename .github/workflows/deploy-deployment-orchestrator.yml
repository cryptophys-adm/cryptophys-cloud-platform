name: Deploy Deployment Orchestrator

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full SHA to deploy from main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-deployment-orchestrator-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and exact commit SHA
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Deployment must be dispatched against main."; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full lowercase SHA is required."; exit 1; }
          [[ "$COMMIT_SHA" == "$GITHUB_SHA" ]] || { echo "Input SHA must equal the dispatched main ref SHA."; exit 1; }

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/deployment-orchestrator
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/deployment-orchestrator/package.json
      - name: Install toolchain
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
      - name: Deploy orchestrator Worker and Durable Object migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify live health and readiness
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          subdomain="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -er '.result.subdomain')"
          base_url="https://cryptophys-deployment-orchestrator.${subdomain}.workers.dev"
          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "${base_url}/health")"
          printf '%s' "$health" | jq -e '
            .status == "ok" and
            .service == "cryptophys-deployment-orchestrator" and
            .environment == "production" and
            .contract_version == "v1"
          '
          readiness="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "${base_url}/ready")"
          printf '%s' "$readiness" | jq -e '
            .status == "ready" and
            .service == "cryptophys-deployment-orchestrator" and
            .production_dispatch_enabled == true
          '
          version="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-deployment-orchestrator/versions" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -er '.result.items[0].id')"
          printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          printf 'Active Worker version: %s\n' "$version"
