name: Deploy Production Deployment Orchestrator

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to deploy the production orchestrator"
        required: true
        type: string
      commit_sha:
        description: "Exact full commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-deployment-orchestrator-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit production confirmation and immutable SHA
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_PRODUCTION" == "DEPLOY" ]] || { echo "Exact confirmation DEPLOY required"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full lowercase commit SHA required"; exit 1; }
          [[ "$COMMIT_SHA" == "$GITHUB_SHA" ]] || { echo "Commit SHA must equal the workflow dispatch ref"; exit 1; }

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/deployment-orchestrator
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require locked dependencies and install
        run: |
          set -euo pipefail
          test -f package-lock.json || {
            echo "Refusing production deployment until workers/deployment-orchestrator/package-lock.json is committed and reviewed."
            exit 1
          }
          npm ci
      - name: Type-check orchestrator
        run: npm run typecheck
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
      - name: Capture active deployment before rollout
        id: before
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-deployment-orchestrator/deployments?per_page=1" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          previous="$(printf '%s' "$response" | jq -er '.result.deployments[0].id // ""')"
          echo "deployment_id=$previous" >> "$GITHUB_OUTPUT"
      - name: Deploy production orchestrator
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify production bindings without exposing secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl --fail --silent --show-error --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-deployment-orchestrator/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          printf '%s' "$config" | jq -e '
            .success == true and
            ([.result.bindings[] | select(.name == "DEPLOYMENT_LOCK" and .type == "durable_object_namespace")] | length == 1) and
            ([.result.bindings[] | select(.name == "GH_ACTIONS_TOKEN" and .type == "secret_text")] | length == 1) and
            ([.result.bindings[] | select(.name == "ORCHESTRATOR_SHARED_SECRET" and .type == "secret_text")] | length == 1)
          ' >/dev/null
          printf 'Durable Object and both required secret bindings are present; values were not read.\n'
      - name: Verify active deployment metadata
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.before.outputs.deployment_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-deployment-orchestrator/deployments?per_page=1" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          printf '%s' "$response" | jq -e --arg previous "$PREVIOUS_DEPLOYMENT_ID" '
            .success == true and
            (.result.deployments | length > 0) and
            (.result.deployments[0].id != $previous) and
            (.result.deployments[0].versions | length == 1) and
            (.result.deployments[0].versions[0].percentage == 100)
          '
          printf 'Verified a new active deployment with 100%% traffic for commit %s. Live HTTP health checks are omitted because no public route is configured.\n' "$COMMIT_SHA"
