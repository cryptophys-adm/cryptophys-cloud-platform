name: Deploy Production Deployment Orchestrator

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to deploy the production orchestrator"
        required: true
        type: string
      commit_sha:
        description: "Exact full commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cryptophys-deployment-orchestrator-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit production confirmation and immutable SHA
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deployment must be dispatched against main."; exit 1; }
          [[ "$CONFIRM_PRODUCTION" == "DEPLOY" ]] || { echo "Exact confirmation DEPLOY required"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Full lowercase commit SHA required"; exit 1; }
          [[ "$COMMIT_SHA" == "$GITHUB_SHA" ]] || { echo "Commit SHA must equal the workflow dispatch ref"; exit 1; }

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/deployment-orchestrator
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check orchestrator
        run: npm run typecheck
      - name: Verify Cloudflare credentials and build the deployment identity allow-list
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          # Production deployment requests are authorized by Cloudflare Access identity (ADR-0004):
          # the CI service token's Client ID plus the operator emails. No shared secret exists.
          lists="$RUNNER_TEMP/identities.env"
          "$GITHUB_WORKSPACE/.github/scripts/access-identities.sh" "$lists"
          sed -n 's/^OPERATOR_IDENTITIES=/DEPLOY_ALLOWED_IDENTITIES=/p' "$lists" >> "$GITHUB_ENV"
          npx wrangler whoami
      - name: Resolve the control-plane D1 database and render the deploy config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}  # D1 Edit (owner decision); Workers deploy keeps CLOUDFLARE_API_TOKEN
          D1_DATABASE_NAME: cryptophys-control-plane
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/render-d1-config.sh" .
          # The orchestrator writes to tables created by migration 0003; Deploy Control Plane applies it.
          applied="$(npx wrangler d1 migrations list "$D1_DATABASE_NAME" --remote --config wrangler.deploy.toml 2>&1)"
          printf '%s\n' "$applied"
          if printf '%s' "$applied" | grep -q '0003_control_plane_services.sql'; then
            echo "::error::Migration 0003 is not applied yet. Run Deploy Control Plane for this commit first."
            exit 1
          fi
      - name: Resolve Cloudflare Access configuration (fails closed if the Workers are not protected)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          ACCESS_APP_NAME: cryptophys-cloud-platform
          EXPECTED_WORKERS: cryptophys-deployment-orchestrator
        run: '"$GITHUB_WORKSPACE/.github/scripts/resolve-access.sh"'
      - name: Remove the retired ORCHESTRATOR_SHARED_SECRET from the Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Deployments never delete secrets, so remove it explicitly (before deploying, so the
          # deployed version is the one annotated with this commit). Idempotent.
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-deployment-orchestrator"
          if curl --fail --silent --show-error --max-time 20 --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${base}/settings" \
              | jq -e '[.result.bindings[] | select(.name == "ORCHESTRATOR_SHARED_SECRET")] | length > 0' >/dev/null; then
            curl --fail --silent --show-error --max-time 20 --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${base}/secrets/ORCHESTRATOR_SHARED_SECRET" \
              | jq -e '.success == true' >/dev/null
            echo "Removed ORCHESTRATOR_SHARED_SECRET from the Worker."
          else
            echo "ORCHESTRATOR_SHARED_SECRET is not present on the Worker."
          fi
      - name: Capture the active Worker versions for automatic rollback (ADR-0009 §3.3)
        id: capture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" capture "$RUNNER_TEMP/rollback.json" cryptophys-deployment-orchestrator'
      - name: Deploy production orchestrator
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.toml --tag "${COMMIT_SHA:0:12}" --message "commit ${COMMIT_SHA}" \
            --var "ACCESS_TEAM_DOMAIN:${ACCESS_TEAM_DOMAIN}" --var "ACCESS_AUD:${ACCESS_AUD}" \
            --var "DEPLOY_ALLOWED_IDENTITIES:${DEPLOY_ALLOWED_IDENTITIES}"
      - name: Verify production bindings without exposing secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl --fail --silent --show-error --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/cryptophys-deployment-orchestrator/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          printf '%s' "$config" | jq -e '
            .success == true and
            ([.result.bindings[] | select(.name == "DEPLOYMENT_LOCK" and .type == "durable_object_namespace")] | length == 1) and
            ([.result.bindings[] | select(.name == "GH_ACTIONS_TOKEN" and .type == "secret_text")] | length == 1) and
            ([.result.bindings[] | select(.name == "ORCHESTRATOR_SHARED_SECRET")] | length == 0) and
            ([.result.bindings[] | select(.name == "DB" and .type == "d1")] | length == 1) and
            ([.result.bindings[] | select(.name == "AI" and .type == "ai")] | length == 1)
          ' >/dev/null
          printf 'Durable Object, D1, AI and GH_ACTIONS_TOKEN bindings are present and no shared secret remains; secret values were not read.\n'
      - name: Verify live health, readiness and active version
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/verify-worker-live.sh" \
            --script cryptophys-deployment-orchestrator \
            --commit "$COMMIT_SHA" \
            --require-access \
            --health-filter '.status == "ok" and .service == "cryptophys-deployment-orchestrator" and .environment == "production" and .contract_version == "v1"' \
            --ready-filter '.status == "ready" and .service == "cryptophys-deployment-orchestrator" and .production_dispatch_enabled == true and ([.checks[]] | all)' \
            --custom-domain deploy-orchestrator.cryptophys.work
      - name: Record the desired version in the Platform Registry (drift baseline)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/record-desired-version.sh" cryptophys-deployment-orchestrator "$COMMIT_SHA"'
      - name: Automatic rollback to the captured versions after a failure or cancellation
        if: always() && (failure() || cancelled()) && steps.capture.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_MESSAGE: "automatic rollback: run ${{ github.run_id }} failed verification"
        run: |
          set -euo pipefail
          # Worker versions only. D1 migrations are forward-only; the registry desired version may now
          # name the failed commit, so drift reports the mismatch until a good commit is deployed.
          "$GITHUB_WORKSPACE/.github/scripts/worker-rollback.sh" restore "$RUNNER_TEMP/rollback.json"
